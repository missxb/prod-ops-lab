---
# ansible/roles/common/handlers/main.yml - 公共 Handlers

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: restart chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: restarted

- name: restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: true

- name: restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: reload sshd
  ansible.builtin.command: systemctl reload sshd
  changed_when: true

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: restart firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: restarted

- name: restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted

- name: restart haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted
