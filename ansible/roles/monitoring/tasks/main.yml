# ======================== 安装 Grafana ========================
- name: 配置 Grafana 仓库
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana Repository
    baseurl: "https://rpm.grafana.com"
    gpgcheck: true
    gpgkey: "https://rpm.grafana.com/gpg.key"
    enabled: true
  when: ansible_os_family == 'RedHat'
  ignore_errors: true
  tags: [monitoring, repo]

- name: 安装 Grafana
  ansible.builtin.package:
    name: "grafana-{{ grafana_version | default('10.4.1') }}"
    state: present
    update_cache: true
  ignore_errors: true
  tags: [monitoring, install]

- name: 创建 Grafana 数据目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'
  loop:
    - "{{ grafana_data_dir | default('/data/grafana') }}"
    - "{{ grafana_data_dir | default('/data/grafana') }}/dashboards"
    - "{{ grafana_data_dir | default('/data/grafana') }}/plugins"
  tags: [monitoring, dirs]

- name: 配置 Grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: grafana
    group: grafana
    mode: '0644'
  notify: restart grafana
  tags: [monitoring, config]

- name: 配置 Prometheus 数据源
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: grafana
    group: grafana
    mode: '0644'
  notify: restart grafana
  tags: [monitoring, datasource]

- name: 安装 Grafana 插件
  ansible.builtin.command: "grafana-cli plugins install {{ item }}"
  loop: "{{ grafana_plugins | default([]) }}"
  register: grafana_plugins_install
  changed_when: "'installed' in grafana_plugins_install.stdout or grafana_plugins_install.rc == 0"
  ignore_errors: true
  tags: [monitoring, plugins]

- name: 启动 Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
  tags: [monitoring, service]

- name: 等待 Grafana 就绪
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port | default(3000) }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 5
  ignore_errors: true
  tags: [monitoring, verify]
