---
# ansible/roles/monitoring/defaults/main.yml - 监控系统默认变量

# Node Exporter
node_exporter_version: "1.7.0"
node_exporter_port: 9100

# Prometheus
prometheus_version: "2.51.0"
prometheus_port: 9090
prometheus_retention_days: 30
prometheus_retention_size: "50GB"
prometheus_data_dir: "/data/prometheus"
prometheus_config_dir: "/etc/prometheus"
prometheus_scrape_interval: "30s"
prometheus_evaluation_interval: "30s"

# Alertmanager
alertmanager_version: "0.27.0"
alertmanager_port: 9093
alertmanager_data_dir: "/data/alertmanager"
alertmanager_config_dir: "/etc/alertmanager"

# Grafana
grafana_version: "10.4.1"
grafana_port: 3000
grafana_admin_user: "admin"
grafana_admin_password: "Grafana@Admin2024!"
grafana_data_dir: "/data/grafana"
grafana_plugins:
  - grafana-clock-panel
  - grafana-piechart-panel
  - grafana-polystat-panel
  - vonage-status-panel
  - grafana-worldmap-panel

# 数据源
grafana_datasources:
  - name: "Prometheus"
    type: "prometheus"
    url: "http://localhost:{{ prometheus_port }}"
    access: "proxy"
    isDefault: true

# 告警规则
alert_rules:
  - name: "InstanceDown"
    alert: "InstanceDown"
    expr: "up == 0"
    for: "1m"
    severity: "critical"

  - name: "HighCPUUsage"
    alert: "HighCPUUsage"
    expr: "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 80"
    for: "5m"
    severity: "warning"

  - name: "HighMemoryUsage"
    alert: "HighMemoryUsage"
    expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85"
    for: "5m"
    severity: "warning"

  - name: "HighDiskUsage"
    alert: "HighDiskUsage"
    expr: "(1 - (node_filesystem_avail_bytes{fstype!=\"tmpfs\"} / node_filesystem_size_bytes{fstype!=\"tmpfs\"})) * 100 > 85"
    for: "5m"
    severity: "warning"
