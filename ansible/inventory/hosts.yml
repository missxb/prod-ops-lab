###############################################################################
# ansible/inventory/hosts.yml - 主机清单
# 
# 分组:
#   - masters: K8s Master 节点
#   - workers: K8s Worker 节点
#   - etcd: etcd 集群节点
#   - monitoring: 监控服务节点
#   - storage: 存储节点
#   - lb: 负载均衡节点
#
# 使用方法:
#   ansible all -i ansible/inventory/hosts.yml -m ping
#   ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/init-all.yml
###############################################################################
---
all:
  children:
    # ======================== K8s Master 节点 ========================
    masters:
      hosts:
        k8s-master-01:
          ansible_host: 192.168.1.101
          node_role: master
          etcd_member: true
          control_plane: true
          labels:
            - node-role.kubernetes.io/master=""
            - node-role.kubernetes.io/control-plane=""
        k8s-master-02:
          ansible_host: 192.168.1.102
          node_role: master
          etcd_member: true
          control_plane: true
          labels:
            - node-role.kubernetes.io/master=""
            - node-role.kubernetes.io/control-plane=""
        k8s-master-03:
          ansible_host: 192.168.1.103
          node_role: master
          etcd_member: true
          control_plane: true
          labels:
            - node-role.kubernetes.io/master=""
            - node-role.kubernetes.io/control-plane=""
      vars:
        ansible_user: root
        ansible_become: true
        containerd_version: "1.7.*"
        kubelet_version: "1.28.0"
        kubeadm_version: "1.28.0"
        kubectl_version: "1.28.0"

    # ======================== K8s Worker 节点 ========================
    workers:
      hosts:
        k8s-worker-01:
          ansible_host: 192.168.1.201
          node_role: worker
          labels:
            - node-role.kubernetes.io/worker=""
            - workload-type: general
        k8s-worker-02:
          ansible_host: 192.168.1.202
          node_role: worker
          labels:
            - node-role.kubernetes.io/worker=""
            - workload-type: general
        k8s-worker-03:
          ansible_host: 192.168.1.203
          node_role: worker
          labels:
            - node-role.kubernetes.io/worker=""
            - workload-type: gpu
        k8s-worker-04:
          ansible_host: 192.168.1.204
          node_role: worker
          labels:
            - node-role.kubernetes.io/worker=""
            - workload-type: memory-intensive
      vars:
        ansible_user: root
        ansible_become: true
        containerd_version: "1.7.*"
        kubelet_version: "1.28.0"

    # ======================== etcd 集群节点 ========================
    etcd:
      hosts:
        etcd-01:
          ansible_host: 192.168.1.31
          etcd_name: etcd-01
          etcd_initial_cluster: "etcd-01=https://192.168.1.31:2380,etcd-02=https://192.168.1.32:2380,etcd-03=https://192.168.1.33:2380"
        etcd-02:
          ansible_host: 192.168.1.32
          etcd_name: etcd-02
          etcd_initial_cluster: "etcd-01=https://192.168.1.31:2380,etcd-02=https://192.168.1.32:2380,etcd-03=https://192.168.1.33:2380"
        etcd-03:
          ansible_host: 192.168.1.33
          etcd_name: etcd-03
          etcd_initial_cluster: "etcd-01=https://192.168.1.31:2380,etcd-02=https://192.168.1.32:2380,etcd-03=https://192.168.1.33:2380"
      vars:
        ansible_user: root
        ansible_become: true
        etcd_version: "3.5.9"
        etcd_data_dir: "/var/lib/etcd"
        etcd_client_port: 2379
        etcd_peer_port: 2380

    # ======================== 监控节点 ========================
    monitoring:
      hosts:
        monitor-01:
          ansible_host: 192.168.1.41
          services:
            - prometheus
            - grafana
            - alertmanager
        monitor-02:
          ansible_host: 192.168.1.42
          services:
            - elasticsearch
            - kibana
            - filebeat
      vars:
        ansible_user: root
        ansible_become: true

    # ======================== 存储节点 ========================
    storage:
      hosts:
        storage-01:
          ansible_host: 192.168.1.51
          storage_type: ceph
          storage_capacity: "10TB"
        storage-02:
          ansible_host: 192.168.1.52
          storage_type: ceph
          storage_capacity: "10TB"
        storage-03:
          ansible_host: 192.168.1.53
          storage_type: ceph
          storage_capacity: "10TB"
      vars:
        ansible_user: root
        ansible_become: true

    # ======================== 负载均衡节点 ========================
    lb:
      hosts:
        lb-01:
          ansible_host: 192.168.1.61
          vip: 192.168.1.60
          role: primary
        lb-02:
          ansible_host: 192.168.1.62
          vip: 192.168.1.60
          role: backup
      vars:
        ansible_user: root
        ansible_become: true
        keepalived_interface: eth0
        keepalived_router_id: 51

  # ======================== 全局变量 ========================
  vars:
    ansible_user: root
    ansible_port: 22
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3
    
    # 集群信息
    cluster_name: enterprise-cloud
    cluster_domain: cluster.local
    pod_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"
    api_server_port: 6443
    
    # 网络配置
    dns_server: "10.96.0.10"
    cni_plugin: "calico"
    
    # 镜像仓库
    registry: "registry.k8s.io"
    registry_mirror: "https://mirror.ccs.tencentyun.com"
    
    # 代理配置
    http_proxy: ""
    https_proxy: ""
    no_proxy: "localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,.cluster.local"
