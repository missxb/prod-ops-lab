# Prometheus 部署清单
# 使用 Helm 安装 kube-prometheus-stack, 此文件作为补充资源
---
# ServiceMonitor for Prometheus itself
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-self-monitoring
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  endpoints:
    - port: web
      interval: 30s
---
# ServiceMonitor for kube-state-metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  endpoints:
    - port: http-metrics
      interval: 30s
---
# ServiceMonitor for node-exporter
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  endpoints:
    - port: metrics
      interval: 30s
---
# PodMonitor for kube-proxy (optional)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kube-proxy
  namespace: kube-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      k8s-app: kube-proxy
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# PrometheusRule - 通用应用监控
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: general-app-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: general.rules
      rules:
        - alert: TargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "目标 {{ $labels.job }}/{{ $labels.instance }} 不可达"
            description: "目标已超过5分钟不可达"

        - alert: TooManyOpenConnections
          expr: process_open_fds / process_max_fds > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "进程文件描述符使用率过高"
            description: "{{ $labels.job }}/{{ $labels.instance }} 文件描述符使用率超过 80%"
