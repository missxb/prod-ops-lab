# metadata:
#   name: manual-cert-request
#   namespace: production
# spec:
#   # PEM编码的CSR
#   csr: |
#     -----BEGIN CERTIFICATE REQUEST-----
#     ... (base64 encoded CSR) ...
#     -----END CERTIFICATE REQUEST-----
#   # 使用的issuer
#   issuerRef:
#     name: letsencrypt-prod
#     kind: ClusterIssuer
#   # 用途
#   usages:
#     - server auth

---
# =============================================================================
# 发布证书到外部密钥管理系统 (如HashiCorp Vault)
# =============================================================================

# Vault Issuer配置示例 (需要安装vault-secrets-webhook)
