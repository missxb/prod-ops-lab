---
# =============================================================================
# ServiceMonitor - Prometheus监控cert-manager
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: monitoring
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  namespaceSelector:
    matchNames:
      - cert-manager
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# cert-manager PrometheusRule - 告警规则
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cert-manager
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: cert-manager
      rules:
        # 证书即将过期告警
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "证书即将过期: {{ $labels.name }}"
            description: "证书 {{ $labels.name }} 将在30天内过期，过期时间: {{ $value | humanUnixTimestamp }}"
            runbook_url: "https://wiki.example.com/runbooks/certificate-expiring"

        # 证书即将过期告警 (7天内)
        - alert: CertificateExpiringCritical
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "证书即将过期: {{ $labels.name }}"
            description: "证书 {{ $labels.name }} 将在7天内过期！"
            runbook_url: "https://wiki.example.com/runbooks/certificate-expiring-critical"

        # 证书签发失败
        - alert: CertificateRequestFailed
          expr: increase(certmanager_certificaterequest_status_condition{condition="False"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "证书签发失败: {{ $labels.name }}"
            description: "证书请求 {{ $labels.name }} 签发失败: {{ $value }}"

        # cert-manager Pod异常
        - alert: CertManagerPodNotReady
          expr: kube_pod_status_ready{namespace="cert-manager",condition="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cert-manager Pod未就绪"
            description: "cert-manager命名空间中的Pod {{ $labels.pod }} 未就绪。"

        # ACME账户注册失败
        - alert: AcmeAccountRegistrationFailed
          expr: certmanager_acme_client_request_duration_seconds_count{status_code="error"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ACME账户注册失败"
            description: "ACME账户注册/更新失败，可能影响证书签发。"

---
# cert-manager RBAC - 允许所有命名空间创建Certificate
# (通常由Helm chart自动创建，此处为手动配置示例)

---
# cert-manager Deployment (Helm安装后的参考配置)
# 实际部署建议使用Helm Chart
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: "v1.14.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9402"
    spec:
      serviceAccountName: cert-manager
      containers:
        - name: cert-manager
          image: quay.io/jetstack/cert-manager-controller:v1.14.0
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --cluster-resource-namespace=$(POD_NAMESPACE)
            - --leader-elect=true
            - --metrics-listen-addr=0.0.0.0:9402
            - --webhook-host=0.0.0.0
            - --webhook-secure-port=10250
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9402
              protocol: TCP
            - name: webhook
              containerPort: 10250
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9402
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9402
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

---
# cert-manager Webhook Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: webhook
    app.kubernetes.io/version: "v1.14.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: cert-manager-webhook
      containers:
        - name: webhook
          image: quay.io/jetstack/cert-manager-webhook:v1.14.0
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --secure-port=10250
            - --healthz-port=6080
            - --metrics-listen-addr=0.0.0.0:9402
          ports:
            - name: https
              containerPort: 10250
              protocol: TCP
            - name: metrics
              containerPort: 9402
              protocol: TCP
            - name: healthz
              containerPort: 6080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6080
            initialDelaySeconds: 5
            periodSeconds: 5

---
# cert-manager CAINjector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cainjector
    app.kubernetes.io/version: "v1.14.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: cainjector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: cainjector
    spec:
      serviceAccountName: cert-manager-cainjector
      containers:
        - name: cainjector
          image: quay.io/jetstack/cert-manager-cainjector:v1.14.0
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --leader-elect=true
            - --metrics-listen-addr=0.0.0.0:9402
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9402
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9402
            initialDelaySeconds: 5
            periodSeconds: 5
