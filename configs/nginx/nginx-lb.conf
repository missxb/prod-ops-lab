###############################################################################
# Nginx 负载均衡配置
# 项目: 企业级云原生运维平台
# 功能: 7层负载均衡，K8s API Server代理，SSL终止
###############################################################################

# ==================== 上游服务器组 ====================
# K8s API Server上游服务器
# 使用最少连接数算法（推荐后端服务器性能不均时）
upstream k8s_api_servers {
    # 负载均衡算法
    # least_conn: 最少连接数（推荐）
    # round-robin: 轮询（默认）
    # ip_hash: 基于IP的哈希（需要会话保持时）
    # hash: 自定义哈希
    least_conn;

    # 会话保持（基于cookie，可选）
    # sticky cookie srv_id expires=1h domain=.example.com path=/;

    # 最大连接失败次数，超过后标记为不可用
    max_fails=3;

    # 失败连接超时时间
    fail_timeout=30s;

    # 后端服务器列表
    # weight: 权重（越大处理的请求越多）
    # max_fails: 最大失败次数
    # fail_timeout: 失败超时时间
    # backup: 标记为备用服务器
    server 192.168.100.10:6443 weight=1 max_fails=3 fail_timeout=30s;
    server 192.168.100.11:6443 weight=1 max_fails=3 fail_timeout=30s;
    server 192.168.100.12:6443 weight=1 max_fails=3 fail_timeout=30s;

    # 备用服务器（所有主服务器不可用时启用）
    # server 192.168.100.100:6443 backup;

    # 长连接配置（与后端保持HTTP长连接）
    # 减少TCP连接建立开销
    keepalive 32;

    # 每个长连接最大请求数
    keepalive_requests 100;

    # 长连接超时时间
    keepalive_timeout 60s;
}

# 应用服务上游服务器
upstream app_servers {
    least_conn;
    max_fails=3;
    fail_timeout=30s;

    server 192.168.100.20:8080 weight=1 max_fails=3 fail_timeout=30s;
    server 192.168.100.21:8080 weight=1 max_fails=3 fail_timeout=30s;
    server 192.168.100.22:8080 weight=1 max_fails=3 fail_timeout=30s;

    keepalive 16;
}

# ==================== K8s API Server负载均衡 ====================
server {
    # 监听端口
    listen 6443 ssl;

    # 服务器名称
    server_name k8s-api.example.com;

    # ==================== SSL配置 ====================
    # SSL证书文件
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL协议版本（禁用不安全的旧版本）
    ssl_protocols TLSv1.2 TLSv1.3;

    # SSL加密套件
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ==================== 速率限制 ====================
    # 限制每秒请求数（防DDoS）
    limit_req zone=api_limit burst=50 nodelay;

    # 限制并发连接数
    limit_conn conn_limit 100;

    # ==================== 代理配置 ====================
    location / {
        # 代理到上游服务器
        proxy_pass http://k8s_api_servers;

        # 设置代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ==================== WebSocket支持 ====================
        # 用于kubectl exec, kubectl logs等长时间连接
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ==================== 超时设置 ====================
        # 连接超时（秒）
        proxy_connect_timeout 10s;

        # 发送超时（秒）
        proxy_send_timeout 60s;

        # 读取超时（秒）
        # 1小时，支持长时间exec命令
        proxy_read_timeout 3600s;

        # ==================== 缓冲设置 ====================
        # 禁用缓冲（实时传输）
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # ==================== 失败重试 ====================
        # 下一个上游服务器重试条件
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # 最大重试次数
        proxy_next_upstream_tries 3;

        # 重试超时时间
        proxy_next_upstream_timeout 30s;
    }

    # ==================== 健康检查端点 ====================
    location /healthz {
        proxy_pass http://k8s_api_servers;
        proxy_set_header Host $host;
        # 不记录健康检查日志
        access_log off;
    }

    # ==================== 指标端点（仅内网访问）====================
    location /metrics {
        proxy_pass http://k8s_api_servers;
        proxy_set_header Host $host;

        # 只允许内网访问
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ==================== 错误页面 ====================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ==================== HTTP到HTTPS重定向 ====================
server {
    listen 80;
    server_name k8s-api.example.com;

    # 重定向到HTTPS
    return 301 https://$host$request_uri;
}

# ==================== 应用服务负载均衡 ====================
server {
    # 监听端口
    listen 80;
    listen 443 ssl;
    server_name app.example.com;

    # ==================== SSL配置 ====================
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # ==================== 安全头 ====================
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止MIME类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # XSS防护
    add_header X-XSS-Protection "1; mode=block" always;

    # HSTS（强制HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 内容安全策略（可选）
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'" always;

    # ==================== 速率限制 ====================
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 50;

    # ==================== 主应用代理 ====================
    location / {
        proxy_pass http://app_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;

        # 失败重试
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # ==================== WebSocket代理 ====================
    location /ws {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ==================== 静态资源 ====================
    location /static/ {
        alias /usr/share/nginx/html/static/;

        # 缓存30天
        expires 30d;
        add_header Cache-Control "public, immutable";

        # 禁用日志
        access_log off;
    }

    # ==================== 健康检查端点 ====================
    location /health {
        proxy_pass http://app_servers;
        access_log off;
    }

    # ==================== 登录限流（更严格）====================
    location /api/auth/login {
        # 更严格的速率限制（防止暴力破解）
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://app_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==================== API限流 ====================
    location /api/ {
        # API请求限流
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://app_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==================== 错误页面 ====================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
