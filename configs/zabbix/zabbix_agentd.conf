# Zabbix Agent配置文件
# 项目: 企业级云原生运维平台
# 用途: 用于物理机/虚拟机监控
# 版本: 1.1.0
# 作者: 运维平台团队

# ==================== Agent全局配置 ====================

# PID文件路径
PidFile=/tmp/zabbix_agentd.pid

# 日志文件路径
LogFile=/var/log/zabbix/zabbix_agentd.log

# 日志文件最大大小（MB），0表示不限制
LogFileSize=100

# 日志级别: 0-5 (0=基础信息, 5=详细调试)
# 生产环境建议使用3
LogType=file
DebugLevel=3

# ==================== Zabbix Server连接配置 ====================

# Zabbix Server被动模式连接地址
# 支持IP地址、主机名、CIDR格式
# 多个地址用逗号分隔
Server=zabbix-server

# Zabbix Server主动模式连接地址
# Agent主动向Server报告数据
ServerActive=zabbix-server

# 主机名（在Zabbix中显示的名称）
# 建议与实际主机名一致
Hostname=Zabbix server

# 主机名在Agent端自动检测
# 优先级: Hostname > HostnameItem
# HostnameItem=system.hostname

# ==================== 监控参数配置 ====================

# 允许执行的远程命令
# 启用后Zabbix Server可以通过Agent执行命令
AllowRemoteCommands=1

# 允许的监控项键值
# 使用通配符限制可监控的项目
AllowKey=system.run[*]
AllowKey=vfs.file.contents[/etc/os-release]
AllowKey=vfs.file.contents[/etc/redhat-release]
AllowKey=system.cpu.util
AllowKey=vm.memory.size
AllowKey=vfs.fs.size[/,pfree]
AllowKey=net.if.in
AllowKey=net.if.out
AllowKey=system.swap.size
AllowKey=system.uptime
AllowKey=agent.ping
AllowKey=agent.version

# 禁用的监控项键值
# DenyKey=system.run[rm -rf /]

# 远程命令超时时间（秒）
Timeout=30

# ==================== 性能配置 ====================

# 被动模式允许的最大并发连接数
# 每个连接使用一个子进程
StartAgents=5

# Agent预派生的子进程数
# 用于主动模式数据采集
StartAgents=5

# 最大子进程数
MaxProcesses=100

# 最大并发采集线程数
# 用于主动模式并发采集
MaxConcurrentChecksPerPoller=100

# 缓存大小（MB）
CacheSize=32M

# 历史数据缓存大小
HistoryCacheSize=16M

# 索引缓存大小
IndexCacheSize=4M

# ==================== 数据采集配置 ====================

# 数据采集频率（秒）
# 默认每30秒采集一次
RefreshActiveChecks=120

# 主动模式下Server连接超时时间（秒）
Timeout=30

# 被动模式数据传输超时（秒）
TransferBufferSize=0

# ==================== 安全配置 ====================

# TLS加密通信配置（推荐生产环境启用）
# TLS连接类型: psk, cert, none
# TLSConnect=psk
# TLSAccept=psk

# PSK预共享密钥标识
# TLSPSKIdentity=PSK_$(hostname)

# PSK密钥文件路径
# TLSPSKFile=/etc/zabbix/zabbix_agentd.psk

# 允许的TLS主机
# TLSServerCertSubject=CN=Zabbix Server

# ==================== 用户参数示例 ====================

# 自定义监控项: MySQL连接数
# UserParameter=mysql.connections,mysql -u monitor -p'monitor_pass' -e "SHOW STATUS LIKE 'Threads_connected'" 2>/dev/null | awk '/Threads_connected/{print $2}'

# 自定义监控项: Nginx活跃连接数
# UserParameter=nginx.active,ss -s | awk '/^TCP:/{print $2}'

# 自定义监控项: Redis内存使用
# UserParameter=redis.memory,redis-cli info memory 2>/dev/null | awk -F: '/used_memory:/{print $2}'

# 自定义监控项: Docker容器数量
# UserParameter=docker.containers,docker ps -q 2>/dev/null | wc -l

# ==================== 包含配置 ====================

# 包含其他配置文件
# Include=/etc/zabbix/zabbix_agentd.d/*.conf

# 自定义配置文件
# Include=/etc/zabbix/zabbix_agentd.local.conf
