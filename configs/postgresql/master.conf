###############################################################################
# PostgreSQL 主节点配置
# 项目: 企业级云原生运维平台
# 功能: 流复制主节点，WAL级别为replica，支持热备
###############################################################################

# ==================== 基本配置 ====================
# 监听地址
listen_addresses = '*'

# 监听端口
port = 5432

# 最大连接数
max_connections = 200

# 超级用户预留连接
superuser_reserved_connections = 5

# 数据目录
#data_directory = '/var/lib/postgresql/data'

# 日志目录
#log_directory = '/var/log/postgresql'

# PID文件
#pid_file = '/var/run/postgresql/postgresql.pid'

# ==================== WAL配置 ====================
# WAL级别: replica 支持流复制和归档
wal_level = replica

# 最大WAL发送进程数
max_wal_senders = 3

# WAL发送者保留段数
wal_keep_size = 1024

# 同步提交: on 确保每次提交都写入WAL
synchronous_commit = on

# 同步备库名称（可留空表示异步）
#synchronous_standby_names = ''

# ==================== 热备配置 ====================
# 启用热备（从库可读）
hot_standby = on

# ==================== 写入性能 ====================
# WAL日志大小
wal_buffers = 64MB

# WAL写入级别
wal_writer_delay = 10ms

# 全写入同步: on 每次提交刷新WAL到磁盘
full_page_writes = on

# ==================== Checkpoint配置 ====================
# checkpoint间隔（分钟）
checkpoint_timeout = 15min

# checkpoint目标（分钟）
checkpoint_completion_target = 0.9

# ==================== 连接认证 ====================
# pg_hba.conf文件路径
hba_file = '/etc/postgresql/pg_hba.conf'

# ident认证文件
ident_file = '/etc/postgresql/pg_ident.conf'

# ==================== 日志配置 ====================
# 日志格式
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '

# 记录DDL
log_statement = 'ddl'

# 慢查询阈值（毫秒）
log_min_duration_statement = 1000

# 连接日志
log_connections = on
log_disconnections = on

# 进程名
cluster_name = 'enterprise-pg'

# ==================== 自动清理 ====================
# 自动清理工作进程数
autovacuum_max_workers = 3

# 自动清理开销延迟
autovacuum_naptime = 1min
