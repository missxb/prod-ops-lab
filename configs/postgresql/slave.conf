###############################################################################
# PostgreSQL 从节点配置
# 项目: 企业级云原生运维平台
# 功能: 流复制从节点，热备模式，只读查询
###############################################################################

# ==================== 基本配置 ====================
# 监听地址
listen_addresses = '*'

# 监听端口
port = 5432

# 最大连接数
max_connections = 200

# 超级用户预留连接
superuser_reserved_connections = 5

# ==================== WAL配置 ====================
# WAL级别: replica 支持热备查询
wal_level = replica

# 最大WAL发送进程数（从库也可以发送WAL给级联从库）
max_wal_senders = 3

# 同步提交: on 确保一致性
synchronous_commit = on

# ==================== 热备配置 ====================
# 启用热备: 从库可接受只读查询
hot_standby = on

# 热备延迟触发阈值（秒）
hot_standby_feedback = on

# ==================== 复制配置 ====================
# 只读模式（从库默认只读）
# primary_conninfo 在 postgresql.auto.conf 中配置

# ==================== 写入性能 ====================
# WAL日志大小
wal_buffers = 64MB

# 全写入同步: on 每次提交刷新WAL到磁盘
full_page_writes = on

# ==================== Checkpoint配置 ====================
# checkpoint间隔（分钟）
checkpoint_timeout = 15min

# checkpoint目标
checkpoint_completion_target = 0.9

# ==================== 连接认证 ====================
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

# ==================== 日志配置 ====================
# 日志格式
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '

# 记录DDL
log_statement = 'ddl'

# 慢查询阈值
log_min_duration_statement = 1000

# 连接日志
log_connections = on
log_disconnections = on

# 进程名
cluster_name = 'enterprise-pg-slave'

# ==================== 自动清理 ====================
autovacuum_max_workers = 3
autovacuum_naptime = 1min
