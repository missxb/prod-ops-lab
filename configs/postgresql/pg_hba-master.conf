###############################################################################
# PostgreSQL pg_hba.conf - 主节点配置
# 项目: 企业级云原生运维平台
# 功能: 控制客户端认证和访问权限
###############################################################################

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ==================== 本地连接 ====================
# 本地超级用户: 信任认证
local   all             postgres                                peer

# 本地所有用户: 需要密码
local   all             all                                     md5

# ==================== 复制连接 ====================
# 允许从库IP进行流复制
# 注意: 替换 192.168.100.11 为实际从库IP
host    replication     repl_user       192.168.100.11/32       scram-sha-256
host    replication     repl_user       192.168.100.0/24        scram-sha-256

# ==================== 应用连接 ====================
# 允许应用网段访问
# 注意: 替换 10.0.0.0/8 为实际应用网段
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# ==================== IPv6 ====================
host    replication     repl_user       ::1/128                 scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# ==================== 拒绝其他连接 ====================
# 拒绝所有其他来源的连接
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
