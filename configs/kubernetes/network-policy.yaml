#===============================================================================
# Kubernetes Network Policies
#===============================================================================
# Default deny all, then allow specific traffic patterns
#===============================================================================

---
# Default deny all ingress traffic in all namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Default deny all egress traffic in production
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-egress
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Egress

---
# Allow DNS traffic (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# Allow ingress from ingress controller to web services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-app
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 443

---
# Allow internal service communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-communication
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}

---
# Allow monitoring traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9100
    - protocol: TCP
      port: 8080

---
# Allow database access from application tier only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-access
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: application
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 3306
    - protocol: TCP
      port: 6379

---
# Allow API server access to all namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-server
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/8
    ports:
    - protocol: TCP
      port: 6443
    - protocol: TCP
      port: 8443

---
# Allow Prometheus scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: production
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9100
    - protocol: TCP
      port: 8080

---
# Default deny all ingress in staging namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: staging
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Default deny all ingress in development namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: development
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Allow development namespace internal communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-internal
  namespace: development
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
