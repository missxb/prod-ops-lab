# =============================================================================
# Kubernetes Pod Security Policies - 企业级云原生运维平台
# 项目: 企业级云原生运维平台
# 功能: Pod安全策略配置，实现Pod级别安全控制
# 部署: kubectl apply -f pod-security.yaml
# 验证: kubectl get psp,psp.clusterrole,constrainttemplate --all-namespaces
# =============================================================================

# =============================================================================
# Pod Security Standards (PSS) - 命名空间安全级别
# 生产环境必须配置!
# =============================================================================

---
# Production命名空间 - 严格级别
# 最严格的安全策略，适合核心业务
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    # 强制执行: 拒绝不符合策略的Pod
    pod-security.kubernetes.io/enforce: restricted
    # 审计: 记录不符合策略的Pod (不拒绝)
    pod-security.kubernetes.io/audit: restricted
    # 警告: 显示不符合策略的Pod警告
    pod-security.kubernetes.io/warn: restricted

---
# Staging命名斯基 - 基线级别
# 中等安全策略，适合测试环境
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Development命名空间 - 基线级别
# 较宽松的安全策略，适合开发环境
apiVersion: v1
kind: Namespace
metadata:
  name: development
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

# =============================================================================
# Pod Security Policy (PSP) - 详细安全策略
# 注意: PSP在K8s 1.25+已弃用，推荐使用Pod Security Standards
# =============================================================================

---
# PSP - 严格策略
# 适用于生产环境核心业务
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: restricted
  labels:
    app.kubernetes.io/name: pod-security-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
    app.kubernetes.io/component: security
spec:
  # 禁止特权模式
  privileged: false
  # 禁止权限提升
  allowPrivilegeEscalation: false
  # 必须丢弃所有能力
  requiredDropCapabilities:
  - ALL
  # 允许的卷类型
  volumes:
  - 'configMap'
  - 'emptyDir'
  - 'projected'
  - 'secret'
  - 'downwardAPI'
  - 'persistentVolumeClaim'
  # 禁止主机网络
  hostNetwork: false
  # 禁止主机IPC
  hostIPC: false
  # 禁止主机PID
  hostPID: false
  # 必须以非root用户运行
  runAsUser:
    rule: 'MustRunAsNonRoot'
  # SELinux配置
  seLinux:
    rule: 'RunAsAny'
  # 补充组配置
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
    - min: 1
      max: 65535
  # 文件系统组配置
  fsGroup:
    rule: 'MustRunAs'
    ranges:
    - min: 1
      max: 65535

---
# PSP - 基线策略
# 适用于测试环境
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: baseline
  labels:
    app.kubernetes.io/name: pod-security-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
    app.kubernetes.io/component: security
spec:
  # 禁止特权模式
  privileged: false
  # 禁止权限提升
  allowPrivilegeEscalation: false
  # 允许所有卷类型
  volumes:
  - '*'
  # 禁止主机网络
  hostNetwork: false
  # 禁止主机IPC
  hostIPC: false
  # 禁止主机PID
  hostPID: false
  # 运行用户配置
  runAsUser:
    rule: 'RunAsAny'
  # SELinux配置
  seLinux:
    rule: 'RunAsAny'
  # 补充组配置
  supplementalGroups:
    rule: 'RunAsAny'
  # 文件系统组配置
  fsGroup:
    rule: 'RunAsAny'

# =============================================================================
# RBAC for Pod Security Policies
# =============================================================================

---
# 严格PSP用户角色
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: restricted-psp-user
  labels:
    app.kubernetes.io/name: psp-rbac
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
rules:
- apiGroups: ['policy']
  resourceNames: ['restricted']
  resources: ['podsecuritypolicies']
  verbs: ['use']

---
# 基线PSP用户角色
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baseline-psp-user
  labels:
    app.kubernetes.io/name: psp-rbac
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
rules:
- apiGroups: ['policy']
  resourceNames: ['baseline']
  resources: ['podsecuritypolicies']
  verbs: ['use']

---
# Service Account RoleBindings for PSP
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: restricted-psp-binding
  labels:
    app.kubernetes.io/name: psp-rbac
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: restricted-psp-user
subjects:
- kind: ServiceAccount
  name: default
  namespace: production

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: baseline-psp-binding
  labels:
    app.kubernetes.io/name: psp-rbac
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: baseline-psp-user
subjects:
- kind: ServiceAccount
  name: default
  namespace: staging
- kind: ServiceAccount
  name: default
  namespace: development

# =============================================================================
# Security Context Templates - 生产级Pod安全模板
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-context-templates
  namespace: kube-system
  labels:
    app.kubernetes.io/name: security-context
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
data:
  # 严格安全上下文模板 (生产环境)
  restricted-pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: restricted-pod-example
      labels:
        app.kubernetes.io/name: example
    spec:
      # Pod级安全上下文
      securityContext:
        # 必须以非root用户运行
        runAsNonRoot: true
        # 运行用户ID
        runAsUser: 1000
        # 运行组ID
        runAsGroup: 1000
        # 文件系统组
        fsGroup: 1000
        # seccomp配置
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: enterprise-registry.local/base/distroless:latest
        # 容器级安全上下文
        securityContext:
          # 禁止权限提升
          allowPrivilegeEscalation: false
          # 只读根文件系统
          readOnlyRootFilesystem: true
          # 必须以非root用户运行
          runAsNonRoot: true
          runAsUser: 1000
          # 丢弃所有能力
          capabilities:
            drop:
            - ALL
        # 资源限制
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
            ephemeral-storage: "1Gi"
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "100Mi"
        # 临时存储挂载 (只读根文件系统需要)
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache
        - name: run
          mountPath: /var/run
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}

  # 严格Deployment模板 (生产环境)
  restricted-deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: restricted-deployment-example
      labels:
        app.kubernetes.io/name: example
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: example
      template:
        metadata:
          labels:
            app.kubernetes.io/name: example
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: app
            image: enterprise-registry.local/base/distroless:latest
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                - ALL
            resources:
              limits:
                cpu: "500m"
                memory: "256Mi"
                ephemeral-storage: "1Gi"
              requests:
                cpu: "100m"
                memory: "128Mi"
                ephemeral-storage: "100Mi"
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache
            - name: run
              mountPath: /var/run
          volumes:
          - name: tmp
            emptyDir: {}
          - name: cache
            emptyDir: {}
          - name: run
            emptyDir: {}

# =============================================================================
# OPA Gatekeeper - 策略即代码
# =============================================================================

---
# Pod安全约束模板
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spodsecurity
  labels:
    app.kubernetes.io/name: gatekeeper-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  crd:
    spec:
      names:
        kind: K8sPodSecurity
      validation:
        openAPIV3Schema:
          type: object
          properties:
            runAsNonRoot:
              type: boolean
            readOnlyRootFilesystem:
              type: boolean
            allowPrivilegeEscalation:
              type: boolean
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spodsecurity

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not input.parameters.runAsNonRoot
          container.securityContext.runAsNonRoot != true
          msg := sprintf("Container %v must set runAsNonRoot to true", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not input.parameters.readOnlyRootFilesystem
          container.securityContext.readOnlyRootFilesystem != true
          msg := sprintf("Container %v must set readOnlyRootFilesystem to true", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not input.parameters.allowPrivilegeEscalation
          container.securityContext.allowPrivilegeEscalation == true
          msg := sprintf("Container %v must not allow privilege escalation", [container.name])
        }

---
# Pod安全约束
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPodSecurity
metadata:
  name: pod-security-restricted
  labels:
    app.kubernetes.io/name: gatekeeper-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups: [""]
      kinds: ["Pod"]
    namespaces:
    - production
  parameters:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

---
# 镜像仓库约束模板
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedregistries
  labels:
    app.kubernetes.io/name: gatekeeper-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRegistries
      validation:
        openAPIV3Schema:
          type: object
          properties:
            registries:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedregistries

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not startswith(container.image, input.parameters.registries[_])
          msg := sprintf("Container %v image %v is not from an allowed registry", [container.name, container.image])
        }

---
# 允许的镜像仓库约束
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRegistries
metadata:
  name: allowed-registries
  labels:
    app.kubernetes.io/name: gatekeeper-policy
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups: [""]
      kinds: ["Pod"]
  parameters:
    registries:
    - "enterprise-registry.local/"  # 企业私有仓库
    - "docker.io/library/"          # Docker官方镜像
    - "gcr.io/distroless/"          # Google Distroless
    - "quay.io/"                    # Red Hat镜像

# =============================================================================
# Pod Security验证命令
# =============================================================================
# 查看PSP:
#   kubectl get psp
#
# 查看Gatekeeper约束:
#   kubectl get constrainttemplates
#   kubectl get k8spodsecurity
#   kubectl get k8sallowedregistries
#
# 测试Pod是否符合策略:
#   kubectl apply -f restricted-pod.yaml -n production
#
# 查看告警:
#   kubectl get events --field-selector reason=FailedCreate
#
# 禁用PSP (如需要):
#   kubectl delete psp restricted
#   kubectl delete psp baseline
#
# 启用Pod Security Standards (K8s 1.25+):
#   kubectl label namespace production pod-security.kubernetes.io/enforce=restricted
# =============================================================================
