#===============================================================================
# Kubernetes RBAC - Admin Configuration
#===============================================================================
# Full cluster admin access with audit logging
#===============================================================================

---
# Admin ClusterRole - Full cluster access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin
  labels:
    app.kubernetes.io/name: rbac-admin
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
rules:
# Full access to all core resources
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]

# Full access to apps resources
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["*"]

# Full access to batch resources
- apiGroups: ["batch"]
  resources: ["*"]
  verbs: ["*"]

# Full access to networking resources
- apiGroups: ["networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]

# Full access to RBAC resources
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["*"]
  verbs: ["*"]

# Full access to storage resources
- apiGroups: ["storage.k8s.io"]
  resources: ["*"]
  verbs: ["*"]

# Full access to policy resources
- apiGroups: ["policy"]
  resources: ["*"]
  verbs: ["*"]

# Full access to admission registration
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["*"]
  verbs: ["*"]

# Full access to apiextensions
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["*"]
  verbs: ["*"]

# Full access to cert-manager resources
- apiGroups: ["cert-manager.io"]
  resources: ["*"]
  verbs: ["*"]

# Full access to monitoring resources
- apiGroups: ["monitoring.coreos.com"]
  resources: ["*"]
  verbs: ["*"]

---
# Admin ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin
  labels:
    app.kubernetes.io/name: rbac-admin
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: administrators
  apiGroup: rbac.authorization.k8s.io

---
# Admin RoleBinding for kube-system namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rbac-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: administrators
  apiGroup: rbac.authorization.k8s.io

---
# Admin RoleBinding for production namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin
  namespace: production
  labels:
    app.kubernetes.io/name: rbac-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: administrators
  apiGroup: rbac.authorization.k8s.io

---
# Admin RoleBinding for staging namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin
  namespace: staging
  labels:
    app.kubernetes.io/name: rbac-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: administrators
  apiGroup: rbac.authorization.k8s.io

---
# Admin RoleBinding for development namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin
  namespace: development
  labels:
    app.kubernetes.io/name: rbac-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: administrators
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole for emergency access (break-glass)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: emergency-admin
  labels:
    app.kubernetes.io/name: rbac-emergency-admin
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
rules:
# Full access to all resources
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---
# Emergency admin ClusterRoleBinding (for break-glass scenario)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: emergency-admin
  labels:
    app.kubernetes.io/name: rbac-emergency-admin
    app.kubernetes.io/part-of: enterprise-cloud-native-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: emergency-admin
subjects:
- kind: Group
  name: emergency-admins
  apiGroup: rbac.authorization.k8s.io
