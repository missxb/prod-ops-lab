###############################################################################
# Redis 主节点配置
# 项目: 企业级云原生运维平台
# 功能: Redis主节点，支持主从复制和持久化
###############################################################################

# ==================== 网络配置 ====================
# 绑定地址（允许远程连接）
bind 0.0.0.0

# 端口
port 6379

# 保护模式（禁用以便远程连接）
# 生产环境建议启用并设置密码
protected-mode no

# TCP backlog（连接队列大小）
tcp-backlog 511

# 客户端空闲超时（秒，0=不超时）
timeout 0

# TCP keepalive间隔（秒）
# 检测死连接
tcp-keepalive 300

# ==================== 认证配置 ====================
# 访问密码（生产环境必须设置）
requirepass redis_pass_2024

# 主节点复制密码
# 从节点需要此密码才能连接主节点
masterauth redis_pass_2024

# ==================== 通用配置 ====================
# 后台运行
daemonize yes

# PID文件
pidfile /var/run/redis/redis-server.pid

# 日志级别: debug, verbose, notice, warning
loglevel notice

# 日志文件
logfile /var/log/redis/redis-server.log

# 数据库数量
databases 16

# 数据目录
dir /var/lib/redis

# ==================== 内存管理 ====================
# 最大内存（建议为物理内存的70-80%）
# 8G内存的服务器建议设置5-6G
maxmemory 2gb

# 内存淘汰策略
# 当内存达到上限时，如何处理新写入
maxmemory-policy allkeys-lru

# LRU检测精度
# 低: 3位精度（节省内存）
# 高: 10位精度（更准确）
maxmemory-samples 5

# ==================== 持久化 - RDB ====================
# RDB（Redis Database）快照配置
# 在指定时间点将内存数据写入磁盘

# 格式: save <秒数> <修改数>
# 含义：在<秒数>内至少有<修改数>次修改时，执行RDB快照

# 900秒内至少1次修改（15分钟）
save 900 1

# 300秒内至少10次修改（5分钟）
save 300 10

# 60秒内至少10000次修改（1分钟）
save 60 10000

# 禁用RDB（不推荐）
# save ""

# RDB文件名
dbfilename dump.rdb

# RDB压缩
# 启用LZF压缩，减小文件大小
rdbcompression yes

# RDB校验
# 启用CRC64校验，检测文件完整性
rdbchecksum yes

# 后台保存失败时停止写入
# 防止数据丢失
stop-writes-on-bgsave-error yes

# ==================== 持久化 - AOF ====================
# AOF（Append Only File）配置
# 每个写操作都追加到AOF文件

# 启用AOF
appendonly yes

# AOF文件名
appendfilename "appendonly.aof"

# AOF同步策略
# always: 每次写操作都同步（最安全，性能最低）
# everysec: 每秒同步一次（推荐，最多丢1秒数据）
# no: 由OS决定（最快，可能丢数据）
appendfsync everysec

# AOF重写时不进行fsync
# 避免大量I/O操作影响性能
no-appendfsync-on-rewrite no

# AOF重写条件
# 当AOF文件增长100%时触发重写
auto-aof-rewrite-percentage 100

# AOF重写最小文件大小
# 小于此大小时不触发重写
auto-aof-rewrite-min-size 64mb

# 加载损坏的AOF文件
# 尝试修复损坏的文件
aof-load-truncated yes

# AOF RDB预加载
# AOF文件开头包含RDB格式数据，加快加载速度
aof-use-rdb-preamble yes

# ==================== 慢查询日志 ====================
# 慢查询阈值（微秒）
# 超过此时间的命令记录到慢查询日志
slowlog-log-slower-than 10000

# 慢查询日志最大长度
# 超过后自动删除最旧的记录
slowlog-max-len 128

# ==================== 复制配置 ====================
# 从节点优先级
# 越小优先级越高
# 0表示永远不升主节点
# 100: 默认值
replica-priority 10

# 从节点只读
replica-read-only yes

# 无盘复制
# 主节点直接传输RDB给从节点，不写本地磁盘
# 节省磁盘I/O
repl-diskless-sync yes

# 无盘复制延迟（秒）
# 等待更多从节点连接，减少多次传输
repl-diskless-sync-delay 5

# 无盘复制管道大小
repl-diskless-sync-max-slaves 10

# 复制积压缓冲区大小
# 用于断线重连时的增量同步
# 建议设置为：每秒写入量 * 断线容忍时间
# 例如：每秒100KB * 60秒 = 6MB
repl-backlog-size 256mb

# 复制积压缓冲区释放时间（秒）
# 所有从节点断开后，等待此时间释放缓冲区
repl-backlog-ttl 3600

# 最小从节点连接数
# 低于此数不进行无盘同步
min-replicas-to-write 1

# 最小从节点延迟（秒）
# 从节点延迟超过此值不计入最小连接数
min-replicas-max-lag 10

# ==================== 安全配置 ====================
# 禁用危险命令
# FLUSHALL: 清空所有数据库
rename-command FLUSHALL ""
# FLUSHDB: 清空当前数据库
rename-command FLUSHDB ""
# KEYS: 查找所有key（生产环境禁用）
# rename-command KEYS ""

# CONFIG命令（远程修改配置，生产环境建议禁用）
# rename-command CONFIG ""

# ==================== 客户端配置 ====================
# 最大客户端连接数
maxclients 10000

# ==================== Lua脚本配置 ====================
# Lua脚本最大执行时间（毫秒）
lua-time-limit 5000

# ==================== 延迟监控 ====================
# 延迟监控（微秒）
# 超过此值的命令记录到延迟日志
# latency-monitor-threshold 100

# 延迟百分位数
latency-tracking-info-percentiles 50 99 99.9

# ==================== 集群配置（可选）====================
# 启用集群模式
# cluster-enabled yes

# 集群配置文件
# cluster-config-file nodes-6379.conf

# 集群节点超时（毫秒）
# cluster-node-timeout 15000

# 集群广播间隔（毫秒）
# cluster-announce-bus-port 16379

# ==================== 热key探测（可选）====================
# 热key探测（微秒）
# hotkey-threshold 100

# ==================== 慢日志格式 ====================
# 慢日志记录命令参数
# slowlog-log-slower-than 10000
# slowlog-max-len 128
