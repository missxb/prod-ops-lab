###############################################################################
# Redis Sentinel 配置
# 项目: 企业级云原生运维平台
# 功能: Redis高可用监控，自动故障转移
# 架构: 3 Sentinel + 1 Master + 2 Slave
###############################################################################

# ==================== 基本配置 ====================
# Sentinel端口
# 用于与其他Sentinel和客户端通信
port 26379

# Sentinel运行模式
daemonize yes

# PID文件
pidfile /var/run/redis/sentinel.pid

# 日志文件
logfile /var/log/redis/sentinel.log

# 日志级别: debug, verbose, notice, warning
loglevel notice

# 工作目录
dir /var/lib/redis/sentinel

# ==================== 监控配置 ====================
# 监控的主节点
# sentinel monitor <master-name> <ip> <port> <quorum>
#
# master-name: 主节点名称（自定义）
# ip: 主节点IP地址
# port: 主节点端口
# quorum: 需要多少个Sentinel同意才能判断主节点故障
#         建议: Sentinel数量/2 + 1
#         3个Sentinel建议quorum=2
sentinel monitor mymaster 192.168.100.10 6379 2

# 主节点密码
# 从节点需要此密码才能连接主节点
sentinel auth-pass mymaster redis_pass_2024

# Sentinel认证密码
# 客户端连接Sentinel时需要
requirepass sentinel_pass_2024

# ==================== 故障检测配置 ====================
# 多长时间无响应认为主观下线（毫秒）
# 超过此时间没有收到主节点响应
# 建议: 5-10秒
sentinel down-after-milliseconds mymaster 5000

# 故障转移超时时间（毫秒）
# 从开始故障转移到完成的时间限制
# 建议: 60-120秒
sentinel failover-timeout mymaster 60000

# 并行同步从节点数量
# 故障转移后，同时同步的从节点数量
# 1: 逐个同步（减少主节点压力）
# >1: 并行同步（更快，但增加主节点压力）
sentinel parallel-syncs mymaster 1

# ==================== 通知配置 ====================
# 故障转移完成后执行的脚本
# 参数: <master-name> <action> <ip> <port> <new-ip> <new-port>
# action: switch-master, sdown, rdown
# sentinel notification-script mymaster /var/lib/redis/notify.sh

# 客户端重配置脚本
# 故障转移后执行，通知客户端更新连接
# sentinel client-reconfig-script mymaster /var/lib/redis/reconfig.sh

# ==================== 高级配置 ====================
# 运行时配置（由Sentinel自动管理，不要手动修改）

# Sentinel ID（自动生成，每个Sentinel唯一）
# sentinel myid <sentinel-id>

# 配置版本（每次修改自动递增）
# sentinel config-epoch mymaster 0

# Leader选举版本
# sentinel leader-epoch mymaster 0

# 当前配置版本
# sentinel current-epoch mymaster 0

# ==================== 通知邮件配置（可选）====================
# 使用redis-cli发送通知
# sentinel notification-script mymaster /etc/redis/sentinel-notify.sh

# ==================== 脚本执行配置 ====================
# 脚本执行超时（秒）
# sentinel script-execution-timeout 60

# ==================== 日志轮转配置 ====================
# Redis日志轮转
# 建议配合logrotate使用
# /etc/logrotate.d/redis-sentinel:
# /var/log/redis/sentinel.log {
#     daily
#     rotate 7
#     compress
#     delaycompress
#     missingok
#     notifempty
#     copytruncate
# }

###############################################################################
# 多Sentinel部署说明
# ============================
# 在3台服务器上分别部署Sentinel，配置如下：
#
# Sentinel 1 (192.168.100.10):
#   port 26379
#   sentinel monitor mymaster 192.168.100.10 6379 2
#   sentinel down-after-milliseconds mymaster 5000
#   sentinel failover-timeout mymaster 60000
#
# Sentinel 2 (192.168.100.11):
#   port 26379
#   sentinel monitor mymaster 192.168.100.10 6379 2
#   sentinel down-after-milliseconds mymaster 5000
#   sentinel failover-timeout mymaster 60000
#
# Sentinel 3 (192.168.100.12):
#   port 26379
#   sentinel monitor mymaster 192.168.100.10 6379 2
#   sentinel down-after-milliseconds mymaster 5000
#   sentinel failover-timeout mymaster 60000
###############################################################################

###############################################################################
# Sentinel集群状态查看命令
# ============================
# 查看所有主节点:
#   redis-cli -p 26379 sentinel masters
#
# 查看指定主节点信息:
#   redis-cli -p 26379 sentinel master mymaster
#
# 查看从节点列表:
#   redis-cli -p 26379 sentinel slaves mymaster
#
# 查看主节点地址:
#   redis-cli -p 26379 sentinel get-master-addr-by-name mymaster
#
# 查看Sentinel列表:
#   redis-cli -p 26379 sentinel sentinels mymaster
#
# 检查Sentinel状态:
#   redis-cli -p 26379 info sentinel
###############################################################################

###############################################################################
# 故障转移流程
# ============================
# 1. Sentinel检测主节点主观下线（down-after-milliseconds）
# 2. 多个Sentinel确认主节点客观下线（quorum）
# 3. 选举Leader Sentinel（Raft算法）
# 4. Leader Sentinel选择最优从节点：
#    a. 过滤不可用的从节点
#    b. 选择replication offset最大的从节点
#    c. 如果offset相同，选择server-id最小的
# 5. 将选中的从节点提升为主节点（SLAVEOF NO ONE）
# 6. 通知其他从节点复制新的主节点
# 7. 更新Sentinel配置，通知客户端
###############################################################################

###############################################################################
# 客户端连接配置
# ============================
# 客户端应该连接Sentinel获取主节点地址，而不是直接连接Redis
#
# Python示例 (redis-py):
#   from redis.sentinel import Sentinel
#   sentinel = Sentinel([
#       ('192.168.100.10', 26379),
#       ('192.168.100.11', 26379),
#       ('192.168.100.12', 26379),
#   ], socket_timeout=0.5)
#   master = sentinel.master_for('mymaster', socket_timeout=0.5)
#   slave = sentinel.slave_for('mymaster', socket_timeout=0.5)
#
# Java示例 (Jedis):
#   Set<String> sentinels = new HashSet<>();
#   sentinels.add("192.168.100.10:26379");
#   sentinels.add("192.168.100.11:26379");
#   sentinels.add("192.168.100.12:26379");
#   JedisSentinelPool pool = new JedisSentinelPool("mymaster", sentinels);
#
# Go示例 (go-redis):
#   rdb := redis.NewFailoverClient(&redis.FailoverOptions{
#       MasterName:    "mymaster",
#       SentinelAddrs: []string{"192.168.100.10:26379", "192.168.100.11:26379", "192.168.100.12:26379"},
#   })
###############################################################################

###############################################################################
# 监控指标
# ============================
# 关键监控指标:
#   - sentinel_masters: 主节点数量
#   - sentinel_slaves: 从节点数量
#   - sentinel_sdown_slaves: 主观下线从节点数量
#   - sentinel_failover_delay: 故障转移延迟
#   - sentinel_failover_in_progress: 故障转移是否进行中
#
# Prometheus Exporter:
#   - redis_exporter: https://github.com/oliver006/redis_exporter
#   - 启用: ./redis_exporter -redis.addr redis://192.168.100.10:6379
###############################################################################

###############################################################################
# 备用Sentinel配置示例（不同端口）
# ============================
# 如果在同一台机器上运行多个Sentinel实例
# 可以使用不同端口
#
# sentinel-1.conf:
#   port 26379
#   daemonize yes
#   pidfile /var/run/redis/sentinel-1.pid
#   logfile /var/log/redis/sentinel-1.log
#   dir /var/lib/redis/sentinel-1
