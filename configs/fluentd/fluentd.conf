  <match>
    @type kafka2
    @id kafka_app_errors
    @label @KAFKA_RETRY

    brokers kafka.logging.svc.cluster.local:9092
    topic_name app-error-logs
    partition_key "hostname"
    partition_key_type "random"

    output_format json
    output_include_tags true
    tag_key "fluentd_tag"

    compression_codec snappy

    <filter>
      @type grep
      <regexp>
        key level
        pattern /ERROR|FATAL|CRITICAL/
      </regexp>
    </filter>

    <buffer>
      @type kafka_buffered
      flush_interval 2s
      flush_thread_count 2
      chunk_limit_size 16m
      queue_limit_length 64
