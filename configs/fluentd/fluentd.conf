# =============================================================================
# Fluentd 完整配置 - 企业级云原生运维平台
# 描述: 多源日志收集、过滤、输出的完整 Fluentd 配置
# 用途: 作为 DaemonSet 运行在 K8s 节点上，收集所有容器和系统日志
# 版本: 1.0.0
# =============================================================================

# =============================================================================
# 全局配置
# =============================================================================
# 配置文件版本（兼容性控制）
# <config>
#   <compat>
#     use_fluentd_config_version_0_12_format true
#   </compat>
# </config>

# 额外配置文件加载
@include conf.d/*.conf

# 工作线程数
# 设置为 CPU 核心数以获得最佳性能
workers 4

# 日志级别 (trace, debug, info, warn, error, fatal)
log_level info

# 回退日志配置
# 当日志级别为 trace/debug 时，使用此格式
log_format json

# 全局超时设置（秒）
# connect_timeout 10
# send_timeout 30
# recover_wait 10
# heartbeat_type tcp
# heartbeat_interval 15
# heartbeat_timeout 15

# 全局缓冲区配置
# buffer_type file
# buffer_chunk_limit 256m
# buffer_queue_limit 64
# flush_interval 5s
# retry_limit 17
# retry_wait 1s
# max_retry_wait 30
# disable_retry_limit false
# num_threads 4
# flush_at_shutdown true

# =============================================================================
# 环境变量配置
# =============================================================================
# Elasticsearch 集群配置
# ES_HOST=elasticsearch.logging.svc.cluster.local
# ES_PORT=9200
# ES_USER=elastic
# ES_PASSWORD=${ELASTICSEARCH_PASSWORD}
# ES_INDEX_PREFIX=logs

# S3/MinIO 配置
# S3_BUCKET=logging-archive
# S3_REGION=us-west-2
# S3_ENDPOINT=s3.amazonaws.com

# 卡夫卡配置
# KAFKA_BROKER=kafka.logging.svc.cluster.local:9092
# KAFKA_TOPIC=container-logs

# =============================================================================
# 输入源配置 (Sources)
# =============================================================================
# =============================================================================

# --- 1. 容器日志 (Container Logs) ---
# 收集 Kubernetes 容器的标准输出日志
# 这是 Fluentd 在 K8s 中最重要的日志源

<source>
  @type tail
  @id container_logs
  @label @CONTAINER_LOGS

  # Kubernetes 容器日志路径模式
  # /var/log/containers/*.log 包含所有容器日志的软链接
  path /var/log/containers/*.log

  # 排除 Fluentd 自身的日志，避免无限循环
  exclude_path ["/var/log/containers/fluentd*.log"]

  # 日志读取位置（从文件末尾开始读取）
  pos_file /var/log/fluentd-containers.log.pos

  # 跟随文件变化（tail -f 效果）
  follow_inodes true

  # 读取间隔（秒）
  read_from_head false

  # 读取超时
  refresh_interval 5s

  # 文件发现间隔
  stat_interval 5s

  # 读取线程数
  # read_threads 4

  # 长行处理
  # long_line_max_size 1m

  # 格式设置
  format multi_format
  <pattern>
    # 多行 Java/Go/Python 异常堆栈跟踪
    format /^(\d{4}[-\/]\d{1,2}[-\/]\d{1,2}[T ]\d{1,2}:\d{2}:\d{2}(?:\.\d+)?(?:Z|[+-]\d{2}:?\d{2})?)\s+(FATAL|ERROR|WARN(?:ING)?|INFO|DEBUG|TRACE)\s+(.+?)(\n\s+at\s+.+|\n\s+Caused by:.+|\n\s+\.\.\. \d+ more.*?)?$/
    time_format %Y-%m-%dT%H:%M:%S.%N%z
    keep_time_key true
    types level:string, message:string
  </pattern>
  <pattern>
    # JSON 格式日志
    format /^\{.*\}$/
    time_type string
    time_key time
    keep_time_key true
    types level:string, message:string
  </pattern>
  <pattern>
    # Nginx/Apache 访问日志格式
    format /^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)"(?: "(?<agent>[^\"]*)")?)?$/
    time_format %d/%b/%Y:%H:%M:%S %z
    keep_time_key true
  </pattern>
  <pattern>
    # 通用 Syslog 格式
    format /^<(\d+)>(\w+ \d+ \d+:\d+:\d+) (?<host>[^ ]+) (?<ident>[^:]+)(?:\[(?<pid>\d+)\])?: *(?<message>.*)$/
    time_format %b %d %H:%M:%S
    keep_time_key true
  </pattern>
  <pattern>
    # 默认纯文本格式
    format /^(?<time>\d{4}[-\/]\d{1,2}[-\/]\d{1,2}[T ]\d{1,2}:\d{2}:\d{2}(?:\.\d+)?)\s+(?<level>\w+)\s+(?<message>.+)$/
    time_format %Y-%m-%dT%H:%M:%S.%N
    keep_time_key true
  </pattern>
  <pattern>
    # 最终回退：只抓取时间戳
    format /^(?<time>.+?)\s+(?<message>.+)$/
    keep_time_key true
  </pattern>

  # 元数据标签
  tag kube.*
  path_key path
  rotate_wait 30s
  skip_refresh_on_restart true

  # 内存限制（防止内存溢出）
  limit_memory 500MB
</source>

# --- 2. 系统日志 (System Logs / Syslog) ---
<source>
  @type tail
  @id system_logs
  @label @SYSTEM_LOGS

  # 收集系统日志文件
  path /var/log/syslog,/var/log/messages,/var/log/secure,/var/log/auth.log,/var/log/kern.log
  pos_file /var/log/fluentd-syslog.log.pos
  read_from_head false
  follow_inodes true
  refresh_interval 10s

  # Syslog 格式解析
  format syslog
  time_format %b %d %H:%M:%S

  tag system.syslog
  path_key path
</source>

# --- 3. Systemd Journal 日志 ---
# 使用 systemd 插件直接读取 journal
<source>
  @type systemd
  @id systemd_journal
  @label @SYSTEM_LOGS

  # 日志过滤
  <filter>
    _SYSTEMD_UNIT=kubelet.service
    _SYSTEMD_UNIT=containerd.service
    _SYSTEMD_UNIT=docker.service
    _SYSTEMD_UNIT=etcd.service
    _SYSTEMD_UNIT=apiserver.service
    _SYSTEMD_UNIT=scheduler.service
    _SYSTEMD_UNIT=controller-manager.service
  </filter>

  # 匹配模式（可选）
  # matches [ "_SYSTEMD_UNIT=kubelet.service" ]

  # Journal 读取位置
  path /var/log/journal
  pos_file /var/log/fluentd-systemd-journal.log.pos

  # 读取超时
  read_from_head false

  # 日志格式
  strip_underscores true
  separate_time true
  output_format json
  output_field message

  tag systemd.*
</source>

# --- 4. Nginx 访问日志 ---
# 收集 Nginx 反向代理访问日志
<source>
  @type tail
  @id nginx_access_logs
  @label @NGINX_LOGS

  path /var/log/nginx/access.log
  pos_file /var/log/fluentd-nginx-access.log.pos
  read_from_head false
  follow_inodes true
  refresh_interval 5s

  # Nginx 日志格式解析
  format nginx
  time_format %d/%b/%Y:%H:%M:%S %z

  tag nginx.access
  path_key path
</source>

# --- 5. Nginx 错误日志 ---
<source>
  @type tail
  @id nginx_error_logs
  @label @NGINX_LOGS

  path /var/log/nginx/error.log
  pos_file /var/log/fluentd-nginx-error.log.pos
  read_from_head false
  follow_inodes true
  refresh_interval 5s

  # 多行错误日志解析
  format multi_format
  <pattern>
    format /^\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}:\d{2} \[(?<level>\w+)\] (?<pid>\d+)#(?<tid>\d+): (?<message>.+)$/
    time_format %Y/%m/%d %H:%M:%S
  </pattern>

  tag nginx.error
  path_key path
</source>

# --- 6. 应用日志 (Application Logs) ---
# 收集自定义应用日志
<source>
  @type tail
  @id application_logs
  @label @APPLICATION_LOGS

  # 收集挂载的应用日志目录
  path /var/log/app/*.log,/var/log/application/*.log
  pos_file /var/log/fluentd-app.log.pos
  read_from_head false
  follow_inodes true
  refresh_interval 5s

  # 多格式日志解析
  format multi_format
  <pattern>
    # JSON 格式日志
    format /^\{.*\}$/
    time_type string
    time_key timestamp
  </pattern>
  <pattern>
    # 时间戳 + 级别 + 消息
    format /^(?<time>\d{4}[-\/]\d{1,2}[-\/]\d{1,2}[T ]\d{1,2}:\d{2}:\d{2}(?:\.\d+)?)\s+\[(?<level>\w+)\]\s+\[(?<module>[^\]]+)\]\s+(?<message>.+)$/
    time_format %Y-%m-%dT%H:%M:%S.%N
  </pattern>
  <pattern>
    # 回退格式
    format /^(?<time>.+?)\s+(?<level>\w+)\s+(?<message>.+)$/
  </pattern>

  tag app.*
  path_key path
</source>

# --- 7. Kubernetes API 日志 (Audit Logs) ---
# 收集 Kubernetes API Server 审计日志
<source>
  @type tail
  @id k8s_audit_logs
  @label @K8S_AUDIT_LOGS

  path /var/log/kubernetes/audit/audit.log
  pos_file /var/log/fluentd-k8s-audit.log.pos
  read_from_head false
  follow_inodes true
  refresh_interval 10s

  # K8s 审计日志 JSON 格式
  format json
  time_key requestReceivedTimestamp
  time_format %Y-%m-%dT%H:%M:%S.%N%Z

  tag k8s.audit
  path_key path

  # 内存限制
  limit_memory 200MB
</source>

# --- 8. Prometheus 指标日志 ---
# 收集 Prometheus 本身的日志
<source>
  @type tail
  @id prometheus_logs
  @label @INFRA_LOGS

  path /var/log/prometheus/*.log
  pos_file /var/log/fluentd-prometheus.log.pos
  read_from_head false
  follow_inodes true
  refresh_interval 10s

  format /^\[(?<time>[^\]]+)\] (?<level>\w+): (?<message>.+)$/
  time_format %Y-%m-%d %H:%M:%S

  tag infra.prometheus
</source>

# --- 9. Grafana 日志 ---
<source>
  @type tail
  @id grafana_logs
  @label @INFRA_LOGS

  path /var/log/grafana/*.log
  pos_file /var/log/fluentd-grafana.log.pos
  read_from_head false
  follow_inodes true
  refresh_interval 10s

  format /^\[(?P<time>[^\]]+)\] \[(?P<level>[^\]]+)\] \[(?P<module>[^\]]*)\]\s*(?P<message>.+)$/
  time_format %Y-%m-%dT%H:%M:%S.%z

  tag infra.grafana
</source>

# --- 10. Fluentd 内部日志 ---
<source>
  @type monitor_agent
  @id monitor_agent
  bind 0.0.0.0
  port 24220

  # 允许所有来源访问（生产环境应限制）
  allow_connection_source 0.0.0.0/0
</source>

# --- 11. Fluentd 内部指标 ---
<source>
  @type prometheus
  @id prometheus_metrics
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>

<source>
  @type prometheus_output_monitor
  @id prometheus_output_monitor
  interval 10
  <labels>
    hostname ${hostname}
  </labels>
</source>

# --- 12. HTTP 输入源（用于接收应用推送日志） ---
# <source>
#   @type http
#   @id http_input
#   bind 0.0.0.0
#   port 9880
#   body_size_limit 32m
#   keep_alive_timeout 10s
# </source>

# --- 13. TCP 输入源（用于接收结构化日志） ---
# <source>
#   @type tcp
#   @id tcp_input
#   tag tcp.app
#   port 5140
#   format json
#   retry_timeout 60
#   heartbeat_interval 15
#   heartbeat_type tcp
# </source>

# =============================================================================
# 过滤器配置 (Filters)
# =============================================================================
# =============================================================================

# --- 容器日志过滤器 ---
<label @CONTAINER_LOGS>
  <filter>
    @type record_transformer
    @id add_container_metadata
    enable_ruby true

    # 从日志文件路径提取容器元数据
    # 路径格式: /var/log/containers/<pod_name>_<namespace>_<container_name>-<container_id>.log
    <record>
      _container_info ${record["path"] ? record["path"].split("/").last.split("_")[2].split("-")[0..-2].join("-") : "unknown"}
      _pod_info ${record["path"] ? record["path"].split("/").last.split("_")[1..-3].join("_") : "unknown"}
      _namespace_info ${record["path"] ? record["path"].split("/").last.split("_")[0..-4].join("_") : "unknown"}
    </record>
  </filter>

  <filter>
    @type record_transformer
    @id enrich_container_logs
    enable_ruby true

    # 提取容器名称和 Pod 名称
    <record>
      container_name ${record["_container_info"]}
      pod_name ${record["_pod_info"]}
      namespace ${record["_namespace_info"]}
    </record>
  </filter>

  <filter>
    @type record_transformer
    @id remove_internal_fields
    remove_keys _container_info,_pod_info,_namespace_info,path_key,path
  </filter>

  # 添加时间戳和主机信息
  <filter>
    @type record_transformer
    @id add_common_fields
    enable_ruby true

    <record>
      hostname ${hostname}
      instance_id ${hostname}
      source_type container
      log_source kubernetes
      environment ${ENV["ENVIRONMENT"] || "production"}
      cluster_name ${ENV["CLUSTER_NAME"] || "default"}
      region ${ENV["REGION"] || "unknown"}
      zone ${ENV["ZONE"] || "unknown"}
    </record>
  </filter>

  # 日志级别标准化
  <filter>
    @type record_transformer
    @id normalize_log_level
    enable_ruby true

    <record>
      level ${record["level"] ? record["level"].upcase : "UNKNOWN"}
    </record>
  </filter>

  # 错误消息提取
  <filter>
    @type record_transformer
    @id extract_error_info
    enable_ruby true

    <record>
      error_code ${record["level"] =~ /ERROR|FATAL|CRITICAL/ ? record["error_code"] || "E000" : nil}
      error_type ${record["level"] =~ /ERROR|FATAL/ ? record["error_type"] || "application_error" : nil}
    </record>
  </filter>

  # 添加分类标签
  <filter>
    @type record_transformer
    @id add_category_tags
    enable_ruby true

    <record>
      tags ${[
        record["namespace"],
        record["pod_name"] ? record["pod_name"].split("-")[0] : nil,
        record["level"] =~ /ERROR|FATAL/ ? "error" : nil,
        record["level"] =~ /WARN/ ? "warning" : nil
      ].compact.uniq}
    </record>
  </filter>

  # 链路追踪关联
  <filter>
    @type record_transformer
    @id add_trace_correlation
    enable_ruby true

    <record>
      correlation_id ${record["request_id"] || record["correlation_id"] || record["trace_id"] || nil}
    </record>
  </filter>
</label>

# --- 系统日志过滤器 ---
<label @SYSTEM_LOGS>
  <filter>
    @type record_transformer
    @id enrich_system_logs
    enable_ruby true

    <record>
      hostname ${hostname}
      source_type system
      log_source syslog
      environment ${ENV["ENVIRONMENT"] || "production"}
    </record>
  </filter>

  <filter>
    @type record_transformer
    @id normalize_system_log_level
    enable_ruby true

    <record>
      level ${record["level"] ? record["level"].upcase : "INFO"}
    </record>
  </filter>
</label>

# --- Nginx 日志过滤器 ---
<label @NGINX_LOGS>
  # Nginx 访问日志过滤器
  <filter>
    @type record_transformer
    @id enrich_nginx_access
    enable_ruby true

    <record>
      hostname ${hostname}
      source_type nginx
      log_source nginx_access
      http_method ${record["method"]}
      http_path ${record["path"]}
      status_code ${record["code"]}
      client_ip ${record["remote"]}
      http_user_agent ${record["agent"]}
      response_time_ms ${record["response_time"] ? (record["response_time"].to_f * 1000).round(2) : nil}
    </record>
  </filter>

  # 状态码分类
  <filter>
    @type record_transformer
    @id nginx_status_classification
    enable_ruby true

    <record>
      status_category ${case record["code"].to_i
        when 200..299 then "success"
        when 300..399 then "redirect"
        when 400..499 then "client_error"
        when 500..599 then "server_error"
        else "unknown"
      end}
    </record>
  </filter>

  # Nginx 错误日志过滤器
  <filter>
    @type record_transformer
    @id enrich_nginx_error
    enable_ruby true

    <record>
      hostname ${hostname}
      source_type nginx
      log_source nginx_error
      level ${record["level"] || "ERROR"}
    </record>
  </filter>
</label>

# --- 应用日志过滤器 ---
<label @APPLICATION_LOGS>
  <filter>
    @type record_transformer
    @id enrich_app_logs
    enable_ruby true

    <record>
      hostname ${hostname}
      source_type application
      log_source application
      environment ${ENV["ENVIRONMENT"] || "production"}
    </record>
  </filter>

  <filter>
    @type record_transformer
    @id normalize_app_log_level
    enable_ruby true

    <record>
      level ${record["level"] ? record["level"].upcase : "INFO"}
    </record>
  </filter>

  # 应用错误堆栈跟踪提取
  <filter>
    @type record_transformer
    @id extract_stack_trace
    enable_ruby true

    <record>
      stack_trace ${record["message"] =~ /(?:Exception|Error|Traceback|panic)/ ? record["stack_trace"] || nil : nil}
    </record>
  </filter>
</label>

# --- K8s 审计日志过滤器 ---
<label @K8S_AUDIT_LOGS>
  <filter>
    @type record_transformer
    @id enrich_k8s_audit
    enable_ruby true

    <record>
      hostname ${hostname}
      source_type k8s_audit
      log_source kubernetes
      cluster_name ${ENV["CLUSTER_NAME"] || "default"}
    </record>
  </filter>

  <filter>
    @type record_transformer
    @id k8s_audit_level
    enable_ruby true

    <record>
      level ${record["level"] || record["stage"] || "INFO"}
    </record>
  </filter>
</label>

# --- 基础设施日志过滤器 ---
<label @INFRA_LOGS>
  <filter>
    @type record_transformer
    @id enrich_infra_logs
    enable_ruby true

    <record>
      hostname ${hostname}
      source_type infrastructure
      log_source infrastructure
      environment ${ENV["ENVIRONMENT"] || "production"}
    </record>
  </filter>
</label>

# =============================================================================
# 输出配置 (Outputs)
# =============================================================================
# =============================================================================

# --- 容器日志输出到 Elasticsearch ---
<label @CONTAINER_LOGS>
  # 主输出：Elasticsearch
  <match>
    @type elasticsearch
    @id es_container_output
    @label @ES_RETRY

    # Elasticsearch 连接配置
    host elasticsearch.logging.svc.cluster.local
    port 9200
    scheme https
    ssl_verify true
    ssl_version TLSv1_2

    # 认证配置
    user elastic
    password "#{ENV['ELASTICSEARCH_PASSWORD']}"

    # 索引配置
    index_name logs
    type_name _doc

    # 索引模板
    template_name logs-template
    template_file /etc/fluentd/configs/elk/index-template.json
    template_overwrite true
    template_create true

    # ILM（索引生命周期管理）
    ilm_policy_id logs-lifecycle-policy
    ilm_policy /etc/fluentd/configs/elk/index-lifecycle-policy.json
    ilm_rollover_alias logs
    ilm_pattern 000001
    ilm_use_alias true

    # 索引名称格式
    index_name logs-%Y.%m.%d

    # 批量发送配置
    include_type_name true
    request_timeout 30s
    reload_connections true
    reload_on_failure true
    reload_on_success true
    reconnect_on_error true

    # 缓冲区配置
    <buffer>
      @type file
      path /var/log/fluentd-buffers/es_container.buffer
      flush_mode interval
      flush_thread_count 4
      flush_interval 5s
      retry_type exponential_backoff
      retry_forever true
      retry_max_interval 300s
      retry_timeout 600s
      chunk_limit_size 256m
      queue_limit_length 256
      overflow_action drop_oldest_chunk
      compress gzip
      total_limit_size 20g
      retry_wait 1s
      retry_limit 17
      num_threads 4
    </buffer>
  </match>

  # 备份输出：S3/MinIO 归档
  <match>
    @type s3
    @id s3_container_backup
    @label @S3_RETRY

    aws_key_id "#{ENV['AWS_ACCESS_KEY_ID']}"
    aws_secret_access_key "#{ENV['AWS_SECRET_ACCESS_KEY']}"
    s3_endpoint "#{ENV['S3_ENDPOINT'] || 'https://s3.amazonaws.com'}"
    s3_region "#{ENV['S3_REGION'] || 'us-west-2'}"

    s3_bucket "#{ENV['S3_BUCKET'] || 'logging-archive'}"
    s3_region "#{ENV['S3_REGION'] || 'us-west-2'}"

    path logs/container/%Y/%m/%d/
    output_format json
    store_as gzip

    # 时间戳格式
    time_slice_format %Y%m%d-%H
    time_slice_wait 10m

    # 缓冲区配置
    <buffer>
      @type file
      path /var/log/fluentd-buffers/s3_container.buffer
      flush_mode interval
      flush_thread_count 2
      flush_interval 10m
      retry_type exponential_backoff
      retry_forever true
      retry_max_interval 300s
      chunk_limit_size 128m
      queue_limit_length 128
      overflow_action drop_oldest_chunk
      compress gzip
      total_limit_size 10g
      retry_wait 5s
      retry_limit 17
    </buffer>
  </match>

  # Kafka 输出（实时流处理）
  <match>
    @type kafka2
    @id kafka_container_output
    @label @KAFKA_RETRY

    brokers kafka.logging.svc.cluster.local:9092
    topic_name container-logs
    partition_key "hostname"
    partition_key_type "random"

    # 消息格式
    output_format json
    output_include_tags true
    tag_key "fluentd_tag"

    # 压缩配置
    compression_codec snappy

    # 重试配置
    max_retry_eighteen_sec 10000000
    max_send_buffer_bytes 5368709120

    # 缓冲区配置
    <buffer topic>
      @type kafka_buffered
      flush_interval 5s
      flush_thread_count 4
      chunk_limit_size 32m
      queue_limit_length 256
      retry_type exponential_backoff
      retry_forever true
      retry_max_interval 300s
      overflow_action drop_oldest_chunk
      compress gzip
      total_limit_size 10g
      retry_wait 1s
      num_threads 4
    </buffer>
  </match>
</label>

