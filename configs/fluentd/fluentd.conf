# --- Elasticsearch 重试配置 ---
<label @ES_RETRY>
  <match>
    @type elasticsearch
    @id es_retry_handler

    host elasticsearch.logging.svc.cluster.local
    port 9200
    scheme https
    ssl_verify true
    ssl_version TLSv1_2

    user elastic
    password "#{ENV['ELASTICSEARCH_PASSWORD']}"

    # 重试配置
    request_timeout 30s
    reload_connections true
    reload_on_failure true
    reconnect_on_error true

    <buffer>
      @type file
      path /var/log/fluentd-buffers/es_retry.buffer
      flush_mode interval
      flush_thread_count 4
      flush_interval 5s
      retry_type exponential_backoff
      retry_forever true
      retry_max_interval 300s
      chunk_limit_size 256m
      queue_limit_length 256
      overflow_action drop_oldest_chunk
      compress gzip
      total_limit_size 20g
      retry_wait 1s
      retry_limit 17
      num_threads 4
    </buffer>
  </match>
</label>

