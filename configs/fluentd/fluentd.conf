# =============================================================================
# 错误处理配置 (Error Handling)
# =============================================================================

# 全局错误处理
# 当日志无法正常发送时的备用输出
<match>
  @type file
  @id error_output
  path /var/log/fluentd/error-logs/error
  append true

  <buffer>
    @type file
    path /var/log/fluentd/error-logs/error.buffer
    flush_mode interval
    flush_thread_count 1
    flush_interval 30s
    retry_type exponential_backoff
    retry_forever true
    retry_max_interval 300s
    chunk_limit_size 64m
    queue_limit_length 64
    overflow_action drop_oldest_chunk
    compress gzip
    total_limit_size 1g
    retry_wait 10s
    num_threads 1
  </buffer>
</match>

# =============================================================================
# 监控指标配置
# =============================================================================

# Fluentd 内部监控端点
<source>
  @type monitor_agent
  @id internal_monitor
  bind 0.0.0.0
  port 24220

  # 允许 Prometheus 抓取指标
  allow_connection_source 0.0.0.0/0
</source>

# Prometheus 输出监控指标
<source>
  @type prometheus_output_monitor
  @id prometheus_output_monitor
  interval 10

  <labels>
    hostname ${hostname}
  </labels>
</source>

