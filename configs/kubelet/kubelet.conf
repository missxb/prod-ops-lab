# Kubelet配置文件 - 生产环境标准配置
# 配置路径: /var/lib/kubelet/config.yaml 或通过kubelet参数配置
# 适用于Kubernetes 1.28+版本

# ============================================
# API服务器连接配置
# ============================================
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration

# kubelet连接API服务器的URL
# 集群部署时通过kubeadm自动配置
# address: "0.0.0.0"
# port: 10250

# ============================================
# 身份验证配置
# ============================================
# kubelet身份验证模式
authentication:
  anonymous:
    enabled: false              # 禁用匿名访问（安全要求）
  webhook:
    enabled: true               # 启用webhook认证
    cacheTTL: "2m0s"            # 认证缓存时间
  x509:
    clientCAFile: "/etc/kubernetes/pki/ca.crt"  # CA证书路径

# kubelet授权模式
authorization:
  mode: Webhook                 # 使用webhook授权
  webhook:
    cacheAuthorizedTTL: "5m0s"  # 授权缓存时间
    webhookCacheUnauthorizedTTL: "30s"

# ============================================
# 容器运行时配置
# ============================================
# 容器运行时端点（CRI）
containerRuntimeEndpoint: "unix:///var/run/containerd/containerd.sock"

# 容器运行时超时时间
containerRuntimeRequestTimeout: "2m0s"

# ============================================
# 镜像GC配置
# ============================================
# 镜像垃圾回收配置
imageGCHighThresholdPercent: 85    # 高水位线（磁盘使用率）
imageGCLowThresholdPercent: 80     # 低水位线
imageMinimumGCAge: "2m0s"          # 最小GC年龄
imageMaximumGCAge: "1h"            # 最大GC年龄

# 镜像垃圾回收间隔
imageGCInterval: "5m"

# ============================================
# 容器GC配置
# ============================================
# 容器垃圾回收配置
containerGCTerminationGracePeriodSeconds: 30
containerGCMaxPerPodContainer: 1
containerGCMaxPodTerminated: -1     # -1表示不限制

# ============================================
# 资源管理配置
# ============================================
# 节点资源分配
systemReserved:
  cpu: "500m"                  # 系统预留CPU
  memory: "1Gi"                # 系统预留内存
  ephemeral-storage: "1Gi"     # 系统预留临时存储

# kubelet预留资源
kubeReserved:
  cpu: "500m"                  # kubelet预留CPU
  memory: "1Gi"                # kubelet预留内存
  ephemeral-storage: "1Gi"     # kubelet预留临时存储

# 压驱逐配置
evictionHard:
  memory.available: "500Mi"    # 内存可用低于500Mi触发驱逐
  nodefs.available: "10%"      # 节点文件系统可用低于10%触发驱逐
  nodefs.inodesFree: "5%"      # 节点文件系统inode可用低于5%触发驱逐
  imagefs.available: "15%"     # 镜像文件系统可用低于15%触发驱逐
  imagefs.inodesFree: "10%"    # 镜像文件系统inode可用低于10%触发驱逐
  pid.available: "10%"         # PID可用低于10%触发驱逐

# 压驱逐软限制
evictionSoft:
  memory.available: "1Gi"
  nodefs.available: "15%"
  nodefs.inodesFree: "10%"
  imagefs.available: "20%"
  imagefs.inodesFree: "15%"
  pid.available: "20%"

# 压驱逐软限制宽限期
evictionSoftGracePeriod:
  memory.available: "1m30s"
  nodefs.available: "1m30s"
  nodefs.inodesFree: "1m"
  imagefs.available: "1m"
  imagefs.inodesFree: "1m"
  pid.available: "1m"

# 压驱逐最大Pod终止时间
evictionMaximumPodGracePeriodSeconds: 120

# ============================================
# 健康检查配置
# ============================================
# 健康检查端口
healthzPort: 10248
healthzBindAddress: "0.0.0.0"

# 健康检查周期
healthCheckPeriod: "10s"

# 健康检查超时时间
healthCheckTimeout: "5s"

# 健康检查失败阈值
healthCheckFailureThreshold: 3

# 健康检查成功阈值
healthCheckSuccessThreshold: 1

# 启动探针配置
startupProbe:
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 5
  successThreshold: 1

# 就绪探针配置
readinessProbe:
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5
  successThreshold: 1

# 存活探针配置
livenessProbe:
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5
  successThreshold: 1

# ============================================
# 日志配置
# ============================================
# kubelet日志级别
# 0: 最少日志
# 1: 基本日志
# 2: 详细日志
# 3: 调试日志
# 4: 非常详细日志
# 5: 追踪日志
# verbosity: 2

# kubelet日志输出位置
# logFile: "/var/log/kubelet.log"

# ============================================
# 调度器配置
# ============================================
# 节点可调度配置
nodeStatusUpdateFrequency: "10s"
nodeLeaseDurationSeconds: 40

# 节点租约更新超时
nodeLeaseUpdateTimeout: "10s"
nodeLeaseUpdateRetry: 5

# ============================================
# 资源限制配置
# ============================================
# 容器默认资源限制
defaultPodMaxResources:
  cpu: "4"                     # 每个Pod最大CPU核数
  memory: "8Gi"                # 每个Pod最大内存

# 最大Pod数量
maxPods: 110

# PodPidsLimit: 每个Pod最大进程数
podsPerCore: 10
podsPerCoreMax: 110

# 最大容器数量
maxContainers: 110

# 最大镜像数量
maxImageGcHighThresholdPercent: 85
maxImageGcLowThresholdPercent: 80

# ============================================
# 网络配置
# ============================================
# 集群DNS配置
clusterDNS:
  - "10.96.0.10"               # 集群DNS服务IP
  - "10.96.0.11"               # 备用DNS

# 集群域名
clusterDomain: "cluster.local"

# DNS搜索域
dnsSearch:
  - "svc.cluster.local"
  - "cluster.local"

# 每个容器的DNS配置
containerDNS:
  nameservers:
    - "223.5.5.5"
    - "223.6.6.6"
  searches:
    - "cluster.local"
    - "svc.cluster.local"
  options:
    - "ndots:5"
    - "timeout:2"
    - "attempts:3"

# ============================================
# 存储配置
# ============================================
# kubelet数据目录
rootDir: "/var/lib/kubelet"

# kubelet证书目录
certDir: "/var/lib/kubelet/pki"

# kubelet日志目录
logDir: "/var/log/kubelet"

# kubelet插件目录
pluginDir: "/var/lib/kubelet/plugins"

# 是否启用挂载传播
enableAttachDetachPlugins: true

# 挂载传播超时时间
mountPropagationTimeout: "5m"

# ============================================
# CRI配置
# ============================================
# CRI端点
containerRuntimeEndpoint: "unix:///var/run/containerd/containerd.sock"

# CRI超时时间
runtimeRequestTimeout: "2m"

# CRI流式连接配置
streamingConnectionIdleTimeout: "4h"

# 每个连接的并发流数量
maxConcurrentStreamsPerConnection: 100

# ============================================
# 保护配置
# ============================================
# 保护节点不被驱逐
protectNodeStatus: true

# 保护镜像不被删除
protectImageGc: true

# 保护系统容器不被删除
protectSystemContainers: true

# 保护静态Pod不被删除
protectStaticPods: true

# ============================================
# 其他配置
# ============================================
# 配置文件路径
configFile: "/var/lib/kubelet/config.yaml"

# 是否启用Kubelet配置
enableKubeletConfigMap: true

# Kubelet配置Map名称
kubeletConfigMapName: "kubelet-config"

# 是否启用配置Map自动更新
enableKubeletConfigMapUpdates: true

# 配置Map更新间隔
kubeletConfigMapUpdateInterval: "1m"

# ============================================
# 指标配置
# ============================================
# 指标端点
metricsBindAddress: "0.0.0.0:10250"

# 指标端口
metricsPort: 10250

# 指标刷新周期
metricsCollectionPeriod: "10s"

# 是否启用指标
enableMetrics: true

# ============================================
# 调试配置
# ============================================
# 调试端口
debugPort: 10251

# 调试绑定地址
debugBindAddress: "0.0.0.0"

# 是否启用调试
enableDebug: false

# ============================================
# 安全配置
# ============================================
# 是否启用只读根文件系统
readOnlyPort: 0                # 禁用只读端口（安全要求）

# 是否启用匿名认证
anonymousAuth: false

# 是否启用webhook认证
webhookAuth: true

# 是否启用授权webhook
authorizationWebhook: true

# 证书验证
clientCAFile: "/etc/kubernetes/pki/ca.crt"

# kubelet证书
tlsCertFile: "/var/lib/kubelet/pki/kubelet.crt"
tlsPrivateKeyFile: "/var/lib/kubelet/pki/kubelet.key"

# ============================================
# 性能配置
# ============================================
# 容器日志轮转
containerLogMaxSize: "10Mi"
containerLogMaxFiles: 5

# 每个容器的最大日志大小
maxContainerLogSize: "10Mi"

# 每个容器的最大日志文件数
maxContainerLogFiles: 5

# 日志轮转策略
logRotationPolicy: "Always"

# 日志轮转压缩
logRotationCompress: true

# ============================================
# 集群配置
# ============================================
# 集群名称
clusterName: "kubernetes"

# 集群DNS域
clusterDNSDomain: "cluster.local"

# 集群DNS搜索域
clusterDNSSearchDomain:
  - "svc.cluster.local"
  - "cluster.local"

# 节点标签
# nodeLabels:
#   - "node-role.kubernetes.io/worker="
#   - "node-role.kubernetes.io/compute="

# 节点注解
# nodeAnnotations:
#   - "node.alpha.kubernetes.io/ttl=0"

# ============================================
# 节点资源监控配置
# ============================================
# 节点资源监控间隔
nodeMonitorResourcePeriod: "10s"

# 节点资源监控超时
nodeMonitorResourceTimeout: "10s"

# 节点资源监控间隔（秒）
nodeMonitorResourceInterval: 10

# 是否启用节点资源监控
enableNodeMonitorResource: true
