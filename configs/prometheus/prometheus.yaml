## Prometheus Helm Values - kube-prometheus-stack
## 生产级配置

## Prometheus 配置
prometheus:
  prometheusSpec:
    # 保留策略
    retention: 30d
    retentionSize: "45GB"

    # 存储配置
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # 资源限制
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

    # 服务发现 - 自动发现所有命名空间的 ServiceMonitor
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: []
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

    # 告警规则选择器
    ruleSelector:
      matchLabels:
        prometheus: kube-prometheus
        role: alert-rules

  # 额外告警规则 - 节点宕机、Pod重启、CPU/内存过高、磁盘满
  additionalPrometheusRulesMap:
    enterprise-rules:
      groups:
        ## 节点宕机告警
        - name: node.rules
          rules:
            - alert: NodeDown
              expr: up{job="node-exporter"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "节点 {{ $labels.instance }} 宕机"
                description: "节点 {{ $labels.instance }} 已超过2分钟不可达，请立即检查"

            - alert: NodeHighCPU
              expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "节点 {{ $labels.instance }} CPU 使用率过高"
                description: "节点 {{ $labels.instance }} CPU 使用率超过 85%，当前值: {{ $value }}%"

            - alert: NodeHighMemory
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "节点 {{ $labels.instance }} 内存使用率过高"
                description: "节点 {{ $labels.instance }} 内存使用率超过 85%，当前值: {{ $value }}%"

            - alert: NodeDiskSpaceHigh
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "节点 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 使用率过高"
                description: "磁盘使用率超过 85%，当前值: {{ $value }}%"

            - alert: NodeDiskSpaceCritical
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 > 95
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "节点 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 即将耗尽"
                description: "磁盘使用率超过 95%，当前值: {{ $value }}%"

        ## Pod 告警
        - name: pod.rules
          rules:
            - alert: PodCrashLooping
              expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 频繁重启"
                description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 在过去15分钟内重启次数过多"

            - alert: PodHighCPU
              expr: sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (namespace, pod) * 100 > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CPU 使用率过高"
                description: "Pod CPU 使用率超过 80%，当前值: {{ $value }}%"

            - alert: PodHighMemory
              expr: container_memory_working_set_bytes{container!=""} / container_spec_memory_limit_bytes * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 内存使用率过高"
                description: "Pod 内存使用率超过 85%，当前值: {{ $value }}%"

            - alert: PodNotReady
              expr: kube_pod_status_ready{condition="true"} == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 长时间未就绪"
                description: "Pod 已超过10分钟处于未就绪状态"

        ## Deployment 告警
        - name: deployment.rules
          rules:
            - alert: DeploymentReplicasMismatch
              expr: kube_deployment_spec_replicas != kube_deployment_status_available_replicas
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 副本数不匹配"
                description: "期望副本数与可用副本数不一致已超过15分钟"

        ## 集群级告警
        - name: cluster.rules
          rules:
            - alert: KubeAPIServerDown
              expr: absent(up{job="apiserver"} == 1)
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Kubernetes API Server 不可达"
                description: "API Server 已超过5分钟不可达"

            - alert: KubeNodeNotReady
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "节点 {{ $labels.node }} NotReady"
                description: "节点 {{ $labels.node }} 已处于 NotReady 状态超过5分钟"

            - alert: PVCUsageHigh
              expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100 > 85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 使用率过高"
                description: "PVC 使用率超过 85%，当前值: {{ $value }}%"

## Grafana 配置
grafana:
  enabled: true
  adminPassword: admin123

  # 预置 Dashboard
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      folderAnnotation: grafana_folder
    datasources:
      enabled: true

  # 资源限制
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Dashboard Providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: 'Kubernetes'
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/default

## Alertmanager 配置
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@example.com'
      smtp_auth_username: 'alertmanager@example.com'
      smtp_auth_password: 'your-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          group_wait: 10s
        - match:
            severity: warning
          receiver: 'warning-receiver'

    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'ops-team@example.com'
            send_resolved: true
        webhook_configs:
          - url: 'http://dingtalk-webhook-proxy:8060/dingtalk/ops/send'
            send_resolved: true

      - name: 'critical-receiver'
        email_configs:
          - to: 'oncall@example.com'
            send_resolved: true
        webhook_configs:
          - url: 'http://dingtalk-webhook-proxy:8060/dingtalk/critical/send'
            send_resolved: true

      - name: 'warning-receiver'
        email_configs:
          - to: 'ops-team@example.com'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']

## Node Exporter
nodeExporter:
  enabled: true

## Kube State Metrics
kubeStateMetrics:
  enabled: true

## Prometheus Operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
