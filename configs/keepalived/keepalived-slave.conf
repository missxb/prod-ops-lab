###############################################################################
# Keepalived 备节点配置
# 项目: 企业级云原生运维平台
# 功能: VIP漂移，健康检查，非抢占模式
# 角色: BACKUP (备节点)
###############################################################################

# ==================== 全局配置 ====================
global_defs {
    # 路由ID（每个节点必须唯一）
    router_id lb-backup

    # 通知脚本
    notification_script /etc/keepalived/scripts/notify.sh

    # 启用脚本安全
    enable_script_security

    # VRRP通告配置
    vrrp_garp_master_delay 10
    vrrp_garp_master_repeat 1
    vrrp_garp_lower_prio_delay 10
    vrrp_garp_lower_prio_repeat 1
    vrrp_garp_interval 0
    vrrp_gna_interval 0

    # 日志级别
    log_level 3

    # 禁用自动优先级降低
    max_auto_priority -1
}

# ==================== VRRP脚本定义 ====================
# Nginx健康检查
vrrp_script check_nginx {
    script "/etc/keepalived/scripts/check_nginx.sh"
    interval 2
    weight -20
    fall 3
    rise 2
    timeout 5
}

# MySQL健康检查
vrrp_script check_mysql {
    script "/etc/keepalived/scripts/check_mysql.sh"
    interval 5
    weight -30
    fall 3
    rise 2
    timeout 5
}

# ==================== VRRP实例定义 ====================
vrrp_instance VI_1 {
    # ==================== 备节点配置 ====================
    # 节点初始状态
    state BACKUP

    # 绑定的网络接口（必须与主节点相同）
    interface eth0

    # 虚拟路由ID（必须与主节点相同）
    virtual_router_id 51

    # 优先级（小于主节点）
    # 主节点: 101, 备节点: 99
    # 差值建议2-10，避免同时接管
    priority 99

    # VRRP通告间隔（秒，必须与主节点相同）
    advert_int 1

    # ==================== 认证配置 ====================
    # 必须与主节点完全相同
    authentication {
        auth_type PASS
        auth_pass ha_secret
    }

    # ==================== 虚拟IP地址 ====================
    # 必须与主节点完全相同
    virtual_ipaddress {
        192.168.100.100/24 dev eth0 label eth0:0
    }

    # ==================== 健康检查关联 ====================
    track_script {
        check_nginx
        check_mysql
    }

    # ==================== 通知脚本 ====================
    notify_master "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME MASTER"
    notify_backup "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME BACKUP"
    notify_fault  "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME FAULT"
    notify_stop   "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME STOP"

    # ==================== 非抢占模式 ====================
    # 备节点同样配置非抢占模式
    # 这样即使备节点优先级高于主节点，也不会主动抢占VIP
    nopreempt

    # ==================== GARP配置 ====================
    garp_master_delay 10
    garp_master_repeat 1
}

