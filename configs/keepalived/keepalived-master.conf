###############################################################################
# Keepalived 主节点配置
# 项目: 企业级云原生运维平台
# 功能: VIP漂移，健康检查，非抢占模式
# 角色: MASTER (主节点)
###############################################################################

# ==================== 全局配置 ====================
global_defs {
    # 路由ID（每个Keepalived节点必须唯一）
    # 建议使用hostname以便识别
    router_id lb-master

    # 通知脚本（VIP漂移时触发）
    # 用于发送告警邮件或执行自定义脚本
    notification_script /etc/keepalived/scripts/notify.sh

    # 启用脚本安全（限制脚本权限）
    enable_script_security

    # VRRP通告配置
    # GARP（免费ARP）广播延迟（秒）
    # 主节点接管VIP后等待多少秒再发送GARP
    vrrp_garp_master_delay 10
    vrrp_garp_master_repeat 1

    # 优先级较低时的GARP配置
    vrrp_garp_lower_prio_delay 10
    vrrp_garp_lower_prio_repeat 1

    # GARP间隔（秒，0=使用默认值）
    vrrp_garp_interval 0
    # GNA间隔（秒，0=使用默认值）
    vrrp_gna_interval 0

    # 日志级别: 0=安静, 1=只提示错误, 2=警告, 3=通知, 4=详细
    log_level 3

    # 自动降低优先级（检测到更优节点时）
    # -1=禁用, 0=不降低, >0=降低值
    max_auto_priority -1

    # 统计数据收集（可选）
    # stats_enable
}

# ==================== VRRP脚本定义 ====================
# 健康检查脚本：检查Nginx是否正常运行
vrrp_script check_nginx {
    # 健康检查脚本路径
    script "/etc/keepalived/scripts/check_nginx.sh"

    # 检查间隔（秒）
    # 建议2-5秒，过快会增加CPU负担
    interval 2

    # 权重（负数表示：检查失败时降低优先级）
    # -20表示检查失败时优先级降低20
    weight -20

    # 连续失败次数，超过此值认为节点故障
    # 3次失败后触发故障转移
    fall 3

    # 连续成功次数，超过此值认为节点恢复
    # 2次成功后恢复节点状态
    rise 2

    # 脚本超时时间（秒）
    timeout 5
}

# 健康检查脚本：检查MySQL是否正常运行
vrrp_script check_mysql {
    script "/etc/keepalived/scripts/check_mysql.sh"
    interval 5
    # MySQL检查失败时降低更多优先级
    weight -30
    fall 3
    rise 2
    timeout 5
}

# ==================== VRRP实例定义 ====================
vrrp_instance VI_1 {
    # ==================== 基本配置 ====================
    # 节点初始状态: MASTER(主) 或 BACKUP(备)
    # 注意：非抢占模式下，此状态仅在首次启动时生效
    state MASTER

    # 绑定的网络接口
    # VIP将漂移到此接口
    interface eth0

    # 虚拟路由ID（同一组Keepalived必须相同）
    # 范围: 1-255
    virtual_router_id 51

    # 优先级（越大优先级越高）
    # 范围: 1-254
    # MASTER通常设置100+，BACKUP设置小于100
    priority 101

    # VRRP通告间隔（秒）
    # 主节点每隔此时间发送VRRP通告
    advert_int 1

    # ==================== 认证配置 ====================
    # 同一组Keepalived必须使用相同的认证配置
    authentication {
        # 认证类型:
        # PASS: 密码认证（推荐）
        # AH: IPSec认证（安全性更高但性能较低）
        auth_type PASS

        # 认证密码
        # 最多8个字符
        # 同一组所有节点必须相同
        auth_pass ha_secret
    }

    # ==================== 虚拟IP地址 ====================
    virtual_ipaddress {
        # VIP地址/子网掩码
        # label: 接口标签，便于识别
        192.168.100.100/24 dev eth0 label eth0:0

        # 可配置多个VIP（如果需要）
        # 192.168.100.101/24 dev eth0 label eth0:1
    }

    # ==================== 健康检查关联 ====================
    # 关联需要监控的脚本
    track_script {
        # 关联Nginx健康检查
        check_nginx

        # 关联MySQL健康检查
        check_mysql
    }

    # ==================== 通知脚本 ====================
    # 当节点状态变化时触发对应的通知脚本
    # $INSTANCE_NAME: VRRP实例名称

    # 节点成为MASTER时触发
    notify_master "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME MASTER"

    # 节点成为BACKUP时触发
    notify_backup "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME BACKUP"

    # 节点进入FAULT状态时触发
    notify_fault  "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME FAULT"

    # Keepalived停止时触发
    notify_stop   "/etc/keepalived/scripts/notify.sh INSTANCE \$INSTANCE_NAME STOP"

    # ==================== 非抢占模式 ====================
    # 启用非抢占模式后，故障恢复的节点不会立即抢占VIP
    # 只有当当前MASTER故障时，才会进行故障转移
    # 优点：
    #   - 避免不必要的VIP漂移
    #   - 减少服务中断时间
    #   - 适合生产环境
    # 缺点：
    #   - 需要手动恢复主节点
    nopreempt

    # ==================== GARP配置 ====================
    # 主节点接管VIP后，发送GARP广播的时间
    # 避免交换机ARP缓存导致的短暂丢包
    garp_master_delay 10
    garp_master_repeat 1

    # ==================== 高级配置 ====================
    # VRRP实例停止后，VIP迁移的等待时间
    # 较小的值可以更快完成故障转移
    # 较大的值可以避免脑裂

    # 同步组（用于同步多个VRRP实例的状态）
    # 如果配置了多个虚拟IP，可以使用同步组
    # sync_group {
    #     group {
    #         VI_1
    #         VI_2
    #     }
    # }

    # LVS同步接口（使用LVS时需要）
    # lvs_sync_daemon_interface eth1

    # VIP地址排除列表
    # 这些VIP不会被自动管理
    # virtual_ipaddress_excluded {
    #     192.168.100.200/24
    # }
}

