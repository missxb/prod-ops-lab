# =============================================================================
# Fluentd 日志收集配置
# 企业级云原生运维平台 - 日志系统
# =============================================================================

# ===== 全局配置 =====
@include kubernetes.conf
@include system.conf
@include auth.conf
@include output.conf

# ===== 容器日志收集 =====
<source>
  @type tail
  @id in_tail_container_logs
  path /var/log/containers/*.log
  pos_file /var/log/fluentd-containers.log.pos
  tag kubernetes.*
  exclude_path ["/var/log/containers/fluentd*"]
  read_from_head true
  <parse>
    @type multi_format
    <pattern>
      format json
      time_key time
      time_format %Y-%m-%dT%H:%M:%S.%NZ
      keep_time_key true
    </pattern>
    <pattern>
      format regexp
      expression /^(?<time>.+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
      time_format %Y-%m-%dT%H:%M:%S.%N%:z
    </pattern>
  </parse>
</source>

# ===== 系统日志收集 =====
<source>
  @type tail
  @id in_tail_syslog
  path /var/log/syslog,/var/log/messages
  pos_file /var/log/fluentd-syslog.log.pos
  tag system.*
  <parse>
    @type syslog
  </parse>
</source>

# ===== 认证日志收集 =====
<source>
  @type tail
  @id in_tail_auth
  path /var/log/auth.log,/var/log/secure
  pos_file /var/log/fluentd-auth.log.pos
  tag auth.*
  <parse>
    @type syslog
  </parse>
</source>

# ===== Kubernetes 元数据过滤 =====
<filter kubernetes.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  kubernetes_url "https://#{ENV['KUBERNETES_SERVICE_HOST']}:#{ENV['KUBERNETES_SERVICE_PORT']}"
  verify_ssl true
  ca_file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearer_token_file /var/run/secrets/kubernetes.io/serviceaccount/token
  skip_labels false
  skip_container_metadata false
  skip_master_url true
  skip_namespace_metadata false
</filter>

# ===== 日志过滤 =====
# 过滤空日志
<filter kubernetes.**>
  @type grep
  <exclude>
    key log
    pattern /^\s*$/
  </exclude>
</filter>

# 添加日志级别检测
<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    log_level ${record["log"] =~ /ERROR|FATAL|CRITICAL/i ? "error" : record["log"] =~ /WARN/i ? "warn" : record["log"] =~ /INFO/i ? "info" : record["log"] =~ /DEBUG/i ? "debug" : "unknown"}
    timestamp ${Time.now.iso8601}
    hostname ${Socket.gethostname}
  </record>
</filter>

# 添加索引日期
<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    index_date ${Time.now.strftime("%Y.%m.%d")}
  </record>
</filter>

# ===== 输出到 Elasticsearch =====
<match kubernetes.**>
  @type elasticsearch
  @id out_es_kubernetes
  @log_level info
  host elasticsearch.logging.svc.cluster.local
  port 9200
  scheme http
  user elastic
  password "#{ENV['ELASTIC_PASSWORD']}"
  index_name kubernetes-${tag_parts[2]}
  type_name _doc
  include_tag_key true
  tag_key @log_name

  # 索引模板
  template_name kubernetes
  template_overwrite true
  template_file /etc/fluentd/templates/kubernetes-template.json

  # 缓冲区配置
  <buffer>
    @type file
    path /var/log/fluentd-buffers/kubernetes.buffer
    flush_mode interval
    flush_interval 30s
    flush_thread_count 2
    retry_type exponential_backoff
    retry_forever true
    retry_max_interval 300
    chunk_limit_size 5M
    total_limit_size 2G
    overflow_action block
    compress gzip
  </buffer>
</match>

<match system.**>
  @type elasticsearch
  @id out_es_system
  host elasticsearch.logging.svc.cluster.local
  port 9200
  scheme http
  user elastic
  password "#{ENV['ELASTIC_PASSWORD']}"
  index_name system-logs
  type_name _doc

  <buffer>
    @type file
    path /var/log/fluentd-buffers/system.buffer
    flush_mode interval
    flush_interval 30s
    flush_thread_count 2
    retry_type exponential_backoff
    retry_forever true
    chunk_limit_size 2M
    total_limit_size 1G
    compress gzip
  </buffer>
</match>

<match auth.**>
  @type elasticsearch
  @id out_es_auth
  host elasticsearch.logging.svc.cluster.local
  port 9200
  scheme http
  user elastic
  password "#{ENV['ELASTIC_PASSWORD']}"
  index_name auth-logs
  type_name _doc

  <buffer>
    @type file
    path /var/log/fluentd-buffers/auth.buffer
    flush_mode interval
    flush_interval 15s
    retry_type exponential_backoff
    retry_forever true
    chunk_limit_size 1M
    total_limit_size 512M
    compress gzip
  </buffer>
</match>

# ===== 监控 =====
<source>
  @type monitor_agent
  @id monitor_agent
  bind 0.0.0.0
  port 24220
</source>

# ===== 监控指标输出 =====
<match monitor.**>
  @type null
</match>
