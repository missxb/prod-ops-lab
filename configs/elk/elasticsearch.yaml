# =============================================================================
# Elasticsearch 生产级配置 - 企业级云原生运维平台
# 项目: 企业级云原生运维平台
# 功能: Elasticsearch集群配置，支持日志存储和检索
# 版本: Elasticsearch 8.x
# 部署: kubectl apply -f elasticsearch.yaml
# 验证: curl -k https://localhost:9200/_cluster/health
# =============================================================================

# =============================================================================
# 集群配置
# =============================================================================
cluster.name: logging-cluster
# 节点名称 (使用环境变量自动获取)
node.name: ${HOSTNAME}
# 节点角色 (混合节点)
# master: 集群管理
# data: 数据存储
# ingest: 数据预处理
# 专用节点建议分离角色:
#   master-only: node.roles: [master]
#   data-only: node.roles: [data, ingest]
node.roles: [master, data, ingest]

# =============================================================================
# 网络配置
# =============================================================================
# 绑定地址
# 0.0.0.0: 监听所有接口 (允许远程访问)
# 127.0.0.1: 仅本地访问
network.host: 0.0.0.0
# HTTP端口 (REST API)
http.port: 9200
# 传输端口 (节点间通信)
transport.port: 9300

# =============================================================================
# 发现配置 (集群发现)
# =============================================================================
# 种子节点列表 (用于集群初始化)
# 生产环境必须配置完整的种子节点列表
discovery.seed_hosts:
  - elasticsearch-0.elasticsearch.logging.svc.cluster.local
  - elasticsearch-1.elasticsearch.logging.svc.cluster.local
  - elasticsearch-2.elasticsearch.logging.svc.cluster.local
# 初始主节点 (首次启动时指定)
cluster.initial_master_nodes:
  - elasticsearch-0
  - elasticsearch-1
  - elasticsearch-2

# =============================================================================
# 路径配置
# =============================================================================
# 数据目录
path.data: /usr/share/elasticsearch/data
# 日志目录
path.logs: /usr/share/elasticsearch/logs

# =============================================================================
# 内存配置
# =============================================================================
# 内存锁定 (防止内存被交换到磁盘)
# 生产环境必须启用!
# 需要设置系统参数: vm.max_map_count=262144
bootstrap.memory_lock: true

# =============================================================================
# 写入配置 (性能优化)
# =============================================================================
# 索引缓冲区大小 (总堆内存的百分比)
indices.memory.index_buffer_size: 15%
# Translog刷新阈值 (超过此大小强制刷新)
index.translog.flush_threshold_size: 512mb
# Translog持久化模式
# async: 异步 (性能好，可能丢1秒数据)
# sync: 同步 (最安全，性能差)
index.translog.durability: async
# Translog同步间隔 (秒)
index.translog.sync_interval: 5s

# =============================================================================
# 索引配置
# =============================================================================
# 自动创建索引 (允许自动创建)
action.auto_create_index: true
# 禁止删除索引 (需要显式名称)
action.destructive_requires_name: true

# =============================================================================
# 线程池配置
# =============================================================================
# 写入线程池队列大小
thread_pool.write.queue_size: 1000
# 搜索线程池队列大小
thread_pool.search.queue_size: 1000

# =============================================================================
# 快照配置
# =============================================================================
# 快照配置已禁用以节省资源
# 生产环境建议启用:
# path.repo: ["/mount/snapshot"]

# =============================================================================
# 安全配置
# =============================================================================
# 安全配置 (生产环境必须启用!)
# xpack.security.enabled: true
# xpack.security.transport.ssl.enabled: true
# xpack.security.http.ssl.enabled: true
# 禁用安全 (仅用于开发/测试)
xpack.security.enabled: false
xpack.security.enrollment.enabled: false

# =============================================================================
# ILM 生命周期策略
# =============================================================================
# 索引生命周期管理
# 30天日志保留策略 (通过API创建)
# PUT _ilm/policy/logs-policy
# {
#   "policy": {
#     "phases": {
#       "hot": { "min_age": "0ms", "actions": { "rollover": { "max_age": "1d", "max_size": "10gb" } } },
#       "warm": { "min_age": "7d", "actions": { "shrink": { "number_of_shards": 1 } } },
#       "cold": { "min_age": "14d", "actions": { "freeze": {} } },
#       "delete": { "min_age": "30d", "actions": { "delete": {} } }
#     }
#   }
# }

# =============================================================================
# 监控
# =============================================================================
xpack.monitoring.collection.enabled: true
xpack.monitoring.history.duration: 7d

# =============================================================================
# JVM配置 (通过环境变量或jvm.options)
# =============================================================================
# 堆内存大小 (必须设置!)
# 推荐: 物理内存的50%，最大不超过32GB
# ES_JAVA_OPTS: "-Xms4g -Xmx4g"
# 系统参数:
#   sysctl -w vm.max_map_count=262144
#   echo "vm.max_map_count=262144" >> /etc/sysctl.conf

# =============================================================================
# Elasticsearch部署验证
# =============================================================================
# 集群健康:
#   curl -k http://localhost:9200/_cluster/health?pretty
#
# 节点状态:
#   curl -k http://localhost:9200/_cat/nodes?v
#
# 索引列表:
#   curl -k http://localhost:9200/_cat/indices?v
#
# 磁盘使用:
#   curl -k http://localhost:9200/_cat/allocation?v
#
# 分片分布:
#   curl -k http://localhost:9200/_cat/shards?v
#
# 创建索引模板:
#   curl -X PUT "http://localhost:9200/_index_template/logs" -H 'Content-Type: application/json' -d @index-template.json
#
# 应用ILM策略:
#   curl -X PUT "http://localhost:9200/_ilm/policy/logs-policy" -H 'Content-Type: application/json' -d @ilm-policy.json
# =============================================================================
